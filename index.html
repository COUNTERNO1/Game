<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f18">
<title>幸存者 · 联网版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#0b0f18;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8eefc;
  }
  #game { display:block; position:fixed; left:0; top:0; width:100%; height:100%; touch-action:none; }
  #ui { position:fixed; left:0; top:0; right:0; bottom:0; pointer-events:none; }
  .screen {
    position:absolute; left:0; top:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px, 2.6vh, 22px); padding:clamp(16px, 4vw, 32px);
    background:radial-gradient(circle at 50% 40%, rgba(30,45,75,.92), rgba(6,9,15,.97));
    pointer-events:auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; z-index:1;
  }
  .hidden { display:none !important; }
  h1 { font-size:clamp(28px, 8vw, 56px); letter-spacing:.12em; color:#7fe0ff;
       text-shadow:0 0 18px rgba(80,200,255,.6); font-weight:800; text-align:center; }
  .subtitle { font-size:clamp(11px, 3vw, 15px); color:#8fa3c8; letter-spacing:.24em; text-align:center; }
  .btn {
    min-height:clamp(46px, 9vh, 58px); min-width:clamp(160px, 44vw, 240px);
    padding:0 clamp(18px, 4vw, 32px); font-size:clamp(16px, 4.2vw, 20px);
    font-weight:700; color:#04121c;
    background:linear-gradient(180deg, #8fe6ff, #43b7e8);
    border:none; border-radius:14px;
    box-shadow:0 4px 0 #1c6d92, 0 8px 20px rgba(0,0,0,.45);
    cursor:pointer; touch-action:manipulation; transition:transform .06s ease;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #1c6d92; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-text {
    background:none; border:none; color:#8fa3c8; font-size:14px;
    padding:8px 12px; text-decoration:underline; cursor:pointer;
    pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .player-hello { font-size:clamp(14px, 3.8vw, 18px); color:#c8d6f0; text-align:center; }
  .player-hello b { color:#7fe0ff; }
  .offline-badge { color:#ffb74d; font-size:0.8em; font-weight:600; margin-left:4px; }

  .auth-input {
    width:min(320px, 78vw); padding:14px 18px; font-size:16px;
    font-family:inherit; border-radius:12px;
    border:2px solid rgba(140, 200, 255, 0.4);
    background:rgba(10, 20, 36, 0.85); color:#e8eefc;
    text-align:center; outline:none; pointer-events:auto;
    -webkit-user-select:text; user-select:text; -webkit-appearance:none;
  }
  .auth-input:focus { border-color:rgba(140, 220, 255, 0.95); box-shadow:0 0 16px rgba(80, 200, 255, 0.45); }
  .auth-input::placeholder { color:#5a6a85; }
  .pw-wrap { position:relative; width:min(320px, 78vw); }
  .pw-wrap .auth-input { width:100%; padding-right:44px; }
  .pw-toggle {
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:34px; height:34px; background:none; border:none;
    color:#8fa3c8; font-size:18px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; pointer-events:auto;
  }
  #screen-auth {
    justify-content:flex-start;
    padding-top:clamp(20px, 8vh, 60px);
    padding-bottom:clamp(20px, 8vh, 60px);
    gap:clamp(8px, 2vh, 16px);
  }
  .auth-tabs {
    display:flex; gap:4px; background:rgba(0,0,0,0.3);
    border-radius:12px; padding:4px;
  }
  .auth-tab {
    padding:10px 24px; background:none; border:none;
    color:#8fa3c8; font-size:16px; font-weight:700;
    border-radius:9px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  .auth-tab.active { background:rgba(100,180,255,0.25); color:#7fe0ff; }
  .auth-panel { display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  .auth-error {
    color:#ff6b81; font-size:13px; min-height:1.2em;
    text-align:center; max-width:340px; word-break:break-word;
    line-height:1.5;
  }
  .nick-status { font-size:12px; min-height:1.2em; text-align:center; color:#8fa3c8; }
  .nick-status.ok { color:#7dffa8; }
  .nick-status.err { color:#ff6b81; }
  .pw-warning { font-size:11px; color:#ffb74d; text-align:center; max-width:320px; line-height:1.4; }
  #screen-account {
    justify-content:flex-start;
    padding-top:clamp(20px, 8vh, 60px);
    padding-bottom:clamp(20px, 8vh, 60px);
    gap:clamp(8px, 2vh, 14px);
  }
  .account-info {
    font-size:clamp(16px, 4vw, 20px); color:#c8d6f0;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:14px; padding:14px 24px;
    text-align:center; max-width:320px;
  }
  .account-info b { color:#7fe0ff; }
  .diff-list { display:flex; flex-direction:column; gap:clamp(8px, 1.8vh, 16px); width:100%; align-items:center; }
  .diff-item { display:flex; flex-direction:column; align-items:center; gap:3px; width:100%; }
  .diff-desc { font-size:clamp(10px, 2.9vw, 13px); color:#93a6c9; text-align:center; }
  .diff-record { font-size:clamp(10px, 2.8vw, 12px); color:#7fe0ff; text-align:center; min-height:1.2em; }
  .diff-btn[data-diff="easy"] { background:linear-gradient(180deg,#a8f5c0,#3fc97a); box-shadow:0 4px 0 #1d7a45, 0 8px 20px rgba(0,0,0,.45); }
  .diff-btn[data-diff="hard"] { background:linear-gradient(180deg,#ffe08a,#f0a72c); box-shadow:0 4px 0 #96650f, 0 8px 20px rgba(0,0,0,.45); }
  .diff-btn[data-diff="hell"] { background:linear-gradient(180deg,#ff9a9a,#e0364f); box-shadow:0 4px 0 #8a1526, 0 8px 20px rgba(0,0,0,.45); color:#fff; }
  .lb-link {
    position:absolute; top:14px; left:14px; padding:9px 15px;
    font-size:13px; font-weight:700; color:#ffd166;
    background:rgba(255, 210, 80, 0.12);
    border:1.5px solid rgba(255, 210, 80, 0.45);
    border-radius:11px; cursor:pointer;
    pointer-events:auto; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; z-index:5;
  }
  .lb-link:active { transform:scale(0.96); }
  .row { display:flex; gap:clamp(10px,3vw,18px); flex-wrap:wrap; justify-content:center; }
  .stats {
    display:flex; flex-direction:column; gap:6px;
    font-size:clamp(14px, 3.8vw, 19px); color:#c8d6f0;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:16px; padding:clamp(12px, 2.4vw, 20px) clamp(24px, 7vw, 52px);
    text-align:center; line-height:1.5; width:100%; max-width:420px;
  }
  .stats b { color:#7fe0ff; font-size:1.15em; font-variant-numeric:tabular-nums; }
  .stats b.rank { color:#ffd166; }
  .upgrade-summary {
    width:100%; max-width:420px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:14px; padding:10px 14px;
  }
  .upgrade-summary-title { font-size:12px; color:#8fa3c8; letter-spacing:.12em; margin-bottom:8px; }
  .upgrade-summary-list {
    display:flex; flex-wrap:wrap; gap:6px;
    max-height:128px; overflow-y:auto;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  .upg-item {
    background:rgba(100,180,255,0.12);
    border:1px solid rgba(100,180,255,0.28);
    border-radius:8px; padding:3px 9px;
    white-space:nowrap; font-size:12px; color:#b8e2ff;
  }
  .upg-empty { color:#7a8aa8; font-size:13px; padding:2px 0; }
  #screen-levelup { background:radial-gradient(circle at 50% 40%, rgba(20,30,55,.80), rgba(6,9,15,.92)); }
  .upgrade-list {
    display:flex; flex-direction:column; gap:clamp(10px, 2vh, 16px);
    width:100%; max-width:420px;
  }
  .upgrade-btn {
    padding:clamp(12px, 2.4vh, 18px) clamp(16px, 4vw, 22px);
    min-height:clamp(60px, 10vh, 76px);
    display:flex; flex-direction:column; align-items:flex-start;
    justify-content:center; gap:4px;
    background:linear-gradient(180deg, #3a5a8a, #24385a);
    border:2px solid rgba(140, 200, 255, 0.35);
    border-radius:14px; color:#fff; cursor:pointer;
    touch-action:manipulation; text-align:left;
    opacity:0; animation:upgradeIn .3s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  .upgrade-btn:active { transform:scale(0.97); border-color:rgba(140, 200, 255, 0.85); }
  @keyframes upgradeIn {
    from { opacity:0; transform:translateY(26px) scale(.9); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  .upgrade-title { font-size:clamp(16px, 4vw, 19px); font-weight:700; color:#b8e2ff; }
  .upgrade-lv {
    display:inline-block; margin-left:8px; padding:1px 7px;
    font-size:11px; font-weight:700; color:#8fc4e8;
    border:1px solid rgba(143,196,232,0.35); border-radius:999px;
    vertical-align:middle;
  }
  .upgrade-desc { font-size:clamp(12px, 3vw, 14px); color:#9ab8d4; }
  #screen-gameover {
    justify-content:flex-start;
    padding-top:clamp(14px, 4vh, 44px);
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  }
  #screen-gameover .row {
    position:fixed; left:0; right:0; bottom:0;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(to top,
      rgba(6,9,15,0.98) 55%,
      rgba(6,9,15,0.85) 82%,
      rgba(6,9,15,0));
    z-index:20; display:flex; gap:clamp(10px, 3vw, 18px);
    justify-content:center; flex-wrap:wrap;
  }
  #screen-gameover .row .btn { min-width:clamp(140px, 40vw, 220px); }
  .corner-btn {
    position:fixed; width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(255,255,255,0.22);
    background:rgba(10,16,28,0.65); color:#cfe4ff;
    font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto; cursor:pointer; z-index:10;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .corner-btn:active { transform:scale(.92); }
  #btn-pause { right:12px; top:12px; display:none; font-size:15px; letter-spacing:-2px; padding-left:2px; }
  #btn-mute  { right:66px; top:12px; }
  #btn-dash {
    right:16px; bottom:16px; width:96px; height:96px;
    font-size:22px; font-weight:800; color:#d9f2ff;
    background:rgba(16,44,78,0.80);
    border:2.5px solid rgba(110,190,255,0.50);
    display:none; flex-direction:column; gap:2px;
    transition:opacity .12s ease;
  }
  #btn-dash.ready {
    border-color:rgba(130,225,255,0.95);
    box-shadow:0 0 22px rgba(80,200,255,0.65);
    background:rgba(22,72,124,0.90);
  }
  #btn-dash:disabled { opacity:.42; }
  #btn-dash small { font-size:10px; letter-spacing:.14em; color:#8fc4e8; font-weight:600; }
  @media (orientation: landscape) {
    #btn-dash { width:108px; height:108px; font-size:24px; }
    #btn-dash small { font-size:11px; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .screen { gap: 6px; padding: 8px 12px; justify-content: flex-start; }
    h1 { font-size: clamp(18px, 3.5vw, 24px) !important; letter-spacing: .06em; }
    .subtitle { font-size: 10px; letter-spacing: .08em; }
    .btn { min-height: 36px; min-width: 110px; padding: 0 14px; font-size: 13px; border-radius: 10px; box-shadow: 0 3px 0 #1c6d92, 0 5px 12px rgba(0,0,0,.4); }
    .btn-text { font-size: 11px; padding: 3px 8px; }
    .player-hello { font-size: 13px; }
    .auth-input, .pw-wrap { width: min(240px, 60vw); }
    .auth-input { padding: 8px 12px; font-size: 13px; border-radius: 9px; }
    .pw-wrap .auth-input { padding-right: 36px; }
    .pw-toggle { width: 28px; height: 28px; font-size: 15px; right: 4px; }
    .auth-tabs { padding: 2px; }
    .auth-tab { padding: 6px 14px; font-size: 12px; border-radius: 7px; }
    .auth-panel { gap: 5px; }
    .auth-error, .nick-status { font-size: 11px; min-height: 1em; }
    .pw-warning { font-size: 10px; }
    #screen-auth { padding: 6px 8px; gap: 5px; }
    #screen-account { padding: 8px 8px; gap: 6px; }
    .account-info { padding: 8px 14px; font-size: 13px; border-radius: 10px; }
    .diff-list { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .diff-item { width: auto; min-width: 140px; gap: 1px; }
    .diff-desc { font-size: 10px; }
    .diff-record { font-size: 10px; }
    .upgrade-list { flex-direction: row; max-width: 100%; gap: 8px; }
    .upgrade-btn { flex: 1; min-width: 0; min-height: 80px; padding: 10px 12px; border-radius: 10px; }
    .upgrade-title { font-size: 14px; }
    .upgrade-desc { font-size: 11px; }
    #screen-gameover {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr;
      gap: 8px;
      padding: 6px 10px calc(60px + env(safe-area-inset-bottom, 0px));
      align-items: start; justify-content: stretch;
    }
    #screen-gameover h1 { grid-column: 1 / -1; font-size: 18px !important; letter-spacing: .04em; text-align: center; }
    #screen-gameover .stats { grid-column: 1; width: 100%; max-width: none; padding: 8px 12px; font-size: 12px; gap: 2px; line-height: 1.4; border-radius: 10px; }
    #screen-gameover .stats b { font-size: 1.1em; }
    #screen-gameover .upgrade-summary { grid-column: 2; width: 100%; max-width: none; max-height: 100%; overflow-y: auto; padding: 8px 12px; border-radius: 10px; -webkit-overflow-scrolling: touch; }
    #screen-gameover .upgrade-summary-title { font-size: 11px; margin-bottom: 5px; }
    #screen-gameover .upgrade-summary-list { max-height: 100%; gap: 4px; }
    #screen-gameover .upg-item { font-size: 10px; padding: 2px 6px; }
    #screen-gameover .row { padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
    #screen-gameover .row .btn { min-height: 36px; font-size: 13px; min-width: 110px; }
    .lb-panel { gap: 6px; padding: 6px 8px; }
    .lb-list { max-height: 60vh; padding: 5px; gap: 4px; }
    .lb-row { padding: 6px 9px; gap: 7px; font-size: 12px; }
    .lb-rank { width: 24px; font-size: 12px; }
    .lb-name { font-size: 12px; }
    .lb-sub { font-size: 10px; }
    .lb-time { font-size: 13px; }
    .lb-score { font-size: 15px; min-width: 54px; }
    .lb-me-row { padding: 6px 9px; font-size: 12px; gap: 7px; }
    #btn-dash { width: 84px; height: 84px; font-size: 18px; }
    #btn-dash small { font-size: 9px; }
  }
  .overlay {
    position:fixed; inset:0;
    background:rgba(6, 9, 15, 0.95);
    display:flex; align-items:center; justify-content:center;
    z-index:60; pointer-events:auto; padding:16px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .lb-panel { display:flex; flex-direction:column; align-items:center; gap:12px; width:100%; max-width:480px; padding:16px 12px; margin:auto; }
  .lb-list {
    width:100%; max-height:56vh; overflow-y:auto;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:14px; padding:8px;
    display:flex; flex-direction:column; gap:6px;
    -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  .lb-row {
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:10px;
    background:rgba(255,255,255,0.03);
    font-size:14px; flex-shrink:0;
  }
  .lb-row.top1 { background:linear-gradient(90deg, rgba(255,215,80,0.22), rgba(255,215,80,0.04)); border:1px solid rgba(255,215,80,0.45); }
  .lb-row.top2 { background:linear-gradient(90deg, rgba(200,220,255,0.14), rgba(200,220,255,0.02)); border:1px solid rgba(200,220,255,0.30); }
  .lb-row.top3 { background:linear-gradient(90deg, rgba(255,170,100,0.14), rgba(255,170,100,0.02)); border:1px solid rgba(255,170,100,0.30); }
  .lb-row.mine { outline:2px solid rgba(125, 255, 168, 0.55); outline-offset:-2px; }
  .lb-rank { width:30px; text-align:center; font-weight:700; color:#7fe0ff; flex-shrink:0; font-size:14px; }
  .lb-row.top1 .lb-rank { color:#ffd166; }
  .lb-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .lb-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#dde8ff; font-weight:600; }
  .lb-sub { font-size:11px; color:#9ab8d4; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-time { flex-shrink:0; font-size:15px; font-weight:700; color:#ffd166; font-variant-numeric:tabular-nums; text-align:right; }
  .lb-score {
    flex-shrink:0; min-width:64px; text-align:right;
    font-size:18px; font-weight:800; color:#ffd166;
    font-variant-numeric:tabular-nums; letter-spacing:0.02em;
  }
  .lb-score::after { content:' 分'; font-size:10px; font-weight:600; color:#9ab8d4; }
  .lb-empty, .lb-loading { padding:34px 10px; text-align:center; color:#7a8aa8; font-size:14px; line-height:1.7; }
  .lb-me-row {
    width:100%; margin-top:6px; padding:9px 12px;
    border-radius:10px;
    background:rgba(125, 255, 168, 0.08);
    border:1px dashed rgba(125, 255, 168, 0.5);
    display:flex; align-items:center; gap:10px;
    font-size:14px; flex-shrink:0;
  }
  #account-overlay .acc-panel {
    display:flex; flex-direction:column; align-items:center;
    gap:10px; width:100%; max-width:420px; padding:20px 16px;
    background:rgba(15,25,45,0.96);
    border:1px solid rgba(140,200,255,0.25);
    border-radius:16px; margin:auto;
  }
  #err-bar {
    position:fixed; left:0; right:0; bottom:0;
    padding:8px 12px;
    background:rgba(120,20,30,0.92);
    color:#ffe; font-size:12px; line-height:1.4;
    display:none; z-index:99; pointer-events:none;
    word-break:break-all;
  }
  /* ★ 新增：协议警告横幅 */
  #protocol-warn {
    position:fixed; left:0; right:0; top:0;
    padding:10px 14px;
    background:#a01828;
    color:#fff;
    font-size:13px; line-height:1.5;
    z-index:200;
    display:none;
    text-align:center;
    pointer-events:auto;
  }
  #protocol-warn b { color:#ffd166; }
  #protocol-warn code {
    background:rgba(0,0,0,0.35);
    padding:1px 6px; border-radius:4px;
    font-family:monospace; word-break:break-all;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- ★ 协议警告横幅 -->
<div id="protocol-warn"></div>

<div id="ui">
  <div class="screen hidden" id="screen-auth">
    <h1 style="font-size:clamp(24px,7vw,40px)">幸存者</h1>
    <div class="subtitle">SURVIVOR</div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>
    <div class="auth-panel" id="auth-panel-login">
      <input id="login-nickname" class="auth-input" type="text" maxlength="12" placeholder="昵称" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="pw-wrap">
        <input id="login-password" class="auth-input" type="password" maxlength="32" placeholder="密码" autocomplete="current-password">
        <button class="pw-toggle" data-target="login-password" type="button">👁</button>
      </div>
      <div class="auth-error" id="login-error"></div>
      <button class="btn" id="btn-login">登录</button>
    </div>
    <div class="auth-panel hidden" id="auth-panel-register">
      <input id="reg-nickname" class="auth-input" type="text" maxlength="12" placeholder="昵称 1–12 字符" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="nick-status" id="reg-nick-status"></div>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, dpr: 1 };
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.max(1, window.innerWidth);
  const h = Math.max(1, window.innerHeight);
  view.w = w; view.h = h; view.dpr = dpr;
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

/* =========================================================
   2. 存档
   ========================================================= */
const SAVE_KEY = 'survivor_save_v1';
const Save = {
  data: {
    easy: { bestTime: 0, bestKills: 0, cleared: false },
    hard: { bestTime: 0, bestKills: 0, cleared: false },
    hell: { bestTime: 0, bestKills: 0, cleared: false }
  },
  load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { raw = null; }
    if (!raw || typeof raw !== 'object') return;
    ['easy','hard','hell'].forEach(k => {
      const r = raw[k] || {}; const d = this.data[k];
      if (typeof r.bestTime === 'number' && isFinite(r.bestTime)) d.bestTime = r.bestTime;
      if (typeof r.bestKills === 'number' && isFinite(r.bestKills)) d.bestKills = r.bestKills;
      d.cleared = !!r.cleared;
    });
  },
  persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) {} },
  record(diffKey, time, kills, cleared) {
    const r = this.data[diffKey]; if (!r) return;
    let changed = false;
    if (time > r.bestTime) { r.bestTime = time; changed = true; }
    if (kills > r.bestKills) { r.bestKills = kills; changed = true; }
    if (cleared && !r.cleared) { r.cleared = true; changed = true; }
    if (changed) this.persist();
  },
  toProgress() {
    const p = {};
    ['easy','hard','hell'].forEach(k => {
      p[k] = {
        bestTime: this.data[k].bestTime,
        bestKills: this.data[k].bestKills,
        cleared: this.data[k].cleared
      };
    });
    return p;
  }
};
Save.load();

const Auth = {

/* =========================================================
   4. 待提交成绩
   ========================================================= */
const PendingScores = {
  KEY: 'survivor_pending_v1',
  list: [],
  load() {
    try { this.list = JSON.parse(localStorage.getItem(this.KEY)) || []; } catch (e) { this.list = []; }
    if (!Array.isArray(this.list)) this.list = [];
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(this.list)); } catch (e) {} },
  push(entry) { this.list.push(entry); this.save(); },
  async retry() {
    if (!Auth.isLoggedIn() || this.list.length === 0) return;
    const remaining = [];
    for (const s of this.list) {
      try {
        const r = await apiFetch('/api/score', { method: 'POST', body: JSON.stringify(s) });
        if (r.status === 401) remaining.push(s);
      } catch (e) { remaining.push(s); }
    }
    this.list = remaining;
    this.save();
  }
};

/* =========================================================
   5. HTTP
   ========================================================= */
function apiFetch(path, options) {
  options = options || {};
  return new Promise((resolve, reject) => {
    let done = false;
    const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      if (controller) try { controller.abort(); } catch (e) {}
      reject(new Error('timeout'));
    }, 5000);

    const headers = Object.assign({}, options.headers || {});
    if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    if (Auth.token) headers['Authorization'] = 'Bearer ' + Auth.token;

    const init = { method: options.method || 'GET', headers };
    if (options.body) init.body = options.body;
    if (controller) init.signal = controller.signal;

    fetch(path, init)
      .then(res => res.json().catch(() => ({})).then(data => ({ status: res.status, data })))
      .then(out => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(out);
      })
      .catch(err => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        reject(err);
      });
  });
}

/* =========================================================
   6. 音频
   ========================================================= */
const AudioSys = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, type, vol, freqEnd) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(Math.max(1, freq), t);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    } catch (e) {}
  },
  toneLater(delay, freq, dur, type, vol) {
    if (!this.ctx || this.muted) return;
    setTimeout(() => this.tone(freq, dur, type, vol), delay * 1000);
  },
  sfxClick() { this.tone(660, 0.05, 'square', 0.03); },
  sfxShoot() { this.tone(900, 0.035, 'square', 0.012, 700); },
  sfxHit() { this.tone(340, 0.03, 'triangle', 0.016); },
  sfxKill() { this.tone(200, 0.08, 'sawtooth', 0.024, 110); },
  sfxHurt() { this.tone(140, 0.18, 'sawtooth', 0.05, 70); },
  sfxDash() { this.tone(520, 0.07, 'square', 0.028, 1500); },

const keys = Object.create(null);
const joystick = {
  active: false, id: null, fixed: false,
  ox: 0, oy: 0, x: 0, y: 0, dx: 0, dy: 0
};

function isLandscape() { return view.w > view.h; }
function getFixedJoyCenter() {
  const cfg = CONFIG.input.fixedJoy;
  return { x: cfg.marginX, y: view.h - cfg.marginY };
}
function updateFixedJoystick(cx, cy) {
  const cfg = CONFIG.input.fixedJoy;
  const R = cfg.radius;
  let dx = cx - joystick.ox;
  let dy = cy - joystick.oy;
  let len = Math.hypot(dx, dy);
  if (len > R) { dx = dx/len*R; dy = dy/len*R; len = R; }
  joystick.x = joystick.ox + dx;
  joystick.y = joystick.oy + dy;
  let mag = Math.min(1, len / (R * CONFIG.input.joystickFullAt));
  if (mag < CONFIG.input.joystickDeadZone) mag = 0;
  if (len > 0.0001) { joystick.dx = (dx/len)*mag; joystick.dy = (dy/len)*mag; }
  else { joystick.dx = joystick.dy = 0; }
}

window.addEventListener('keydown', (e) => {
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (game.state === GameState.PLAYING || game.state === GameState.PAUSED) {
      e.preventDefault(); togglePause(); return;
    }
  }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    e.preventDefault(); if (!e.repeat) tryDash(); return;
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  AudioSys.init();
}, { passive: false });

window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

canvas.addEventListener('pointerdown', (e) => {
  AudioSys.init();
  if (game.state !== GameState.PLAYING) return;
  if (joystick.id !== null) return;

  if (isLandscape()) {
    if (e.clientX > view.w * CONFIG.input.fixedJoy.activateLeftRatio) return;
    const c = getFixedJoyCenter();
    joystick.id = e.pointerId;
    joystick.active = true;
    joystick.fixed = true;
    joystick.ox = c.x; joystick.oy = c.y;
    updateFixedJoystick(e.clientX, e.clientY);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
    return;
  }
  joystick.id = e.pointerId;
  joystick.active = true;
  joystick.fixed = false;
  joystick.ox = joystick.x = e.clientX;
  joystick.oy = joystick.y = e.clientY;
  joystick.dx = joystick.dy = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  if (!joystick.active || e.pointerId !== joystick.id) return;
  if (joystick.fixed) { updateFixedJoystick(e.clientX, e.clientY); e.preventDefault(); return; }
  const R = CONFIG.input.joystickRadius;
  let dx = e.clientX - joystick.ox;
  let dy = e.clientY - joystick.oy;
  let len = Math.hypot(dx, dy);
  if (len > R) { dx = dx/len*R; dy = dy/len*R; len = R; }
  joystick.x = joystick.ox + dx;
  joystick.y = joystick.oy + dy;
  let mag = Math.min(1, len / (R * CONFIG.input.joystickFullAt));
  if (mag < CONFIG.input.joystickDeadZone) mag = 0;
  if (len > 0.0001) { joystick.dx = (dx/len)*mag; joystick.dy = (dy/len)*mag; }
  else { joystick.dx = joystick.dy = 0; }
  e.preventDefault();
}, { passive: false });

function endJoystick(e) {
  if (e.pointerId !== joystick.id) return;
  joystick.id = null;
  joystick.active = false;
  joystick.fixed = false;
  joystick.dx = joystick.dy = 0;
}

const SCROLLABLE_SELECTORS = [

  const target = e.target;
  if (target) {
    if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') return;
    if (target.closest) {
      for (let i = 0; i < SCROLLABLE_SELECTORS.length; i++) {
        if (target.closest(SCROLLABLE_SELECTORS[i])) return;
      }
    }
  }
  e.preventDefault();
}, { passive: false });

function getMoveVector() {
  let x = 0, y = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    y -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  y += 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) x += 1;
  x += joystick.dx;
  y += joystick.dy;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  return { x, y };
}

/* =========================================================
   10. 冲刺
   ========================================================= */
function getDashDirection() {
  const mv = getMoveVector();
  const len = Math.hypot(mv.x, mv.y);
  if (len > 0.01) return { x: mv.x / len, y: mv.y / len };
  let nearest = null, minD2 = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const dx = e.x - player.x, dy = e.y - player.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < minD2) { minD2 = d2; nearest = e; }
  }
  if (nearest) {
    const dx = nearest.x - player.x, dy = nearest.y - player.y;
    const d = Math.hypot(dx, dy) || 1;
    return { x: dx/d, y: dy/d };
  }
  return { x: 0, y: 0 };
}

function tryDash() {
  if (game.state !== GameState.PLAYING) return;
  if (player.dashing) return;
  if (player.dashCharges <= 0) return;
  const dir = getDashDirection();
  if (dir.x === 0 && dir.y === 0) return;
  player.dashing = true;
  player.dashT = CONFIG.dash.duration;
  player.dashDirX = dir.x;
  player.dashDirY = dir.y;
  player.dashSpeed = CONFIG.dash.distance / CONFIG.dash.duration;
  if (CONFIG.dash.invincible) player.dashInvuln = CONFIG.dash.duration + 0.05;
  player.dashCharges--;
  if (player.dashRecharge <= 0) player.dashRecharge = CONFIG.dash.cooldown;
  AudioSys.sfxDash();
  updateDashUI(true);
}

function spawnDashTrail() {
  dashTrails.push({
    x: player.x, y: player.y, r: player.r,
    life: CONFIG.dash.trailLife, maxLife: CONFIG.dash.trailLife
  });
  if (dashTrails.length > 24) dashTrails.shift();
}

function updateDashTrails(dt) {
  for (let i = dashTrails.length - 1; i >= 0; i--) {
    dashTrails[i].life -= dt;
    if (dashTrails[i].life <= 0) dashTrails.splice(i, 1);
  }
}
