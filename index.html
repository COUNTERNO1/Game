/* =========================================================
   12. 伤害 / 反馈
   ========================================================= */
function addDamageNumber(x, y, value, crit) {
  damageNumbers.push({
    x: x + (Math.random() - 0.5) * 12, y: y - 6,
    vy: -CONFIG.fx.dmgNumRise,
    life: CONFIG.fx.dmgNumLife, maxLife: CONFIG.fx.dmgNumLife,
    text: String(Math.round(value)), crit: !!crit
  });
  if (damageNumbers.length > 120) damageNumbers.splice(0, damageNumbers.length - 120);
}
function updateDamageNumbers(dt) {
  for (let i = damageNumbers.length - 1; i >= 0; i--) {
    const d = damageNumbers[i];
    d.y += d.vy * dt; d.vy *= Math.exp(-5 * dt); d.life -= dt;
    if (d.life <= 0) damageNumbers.splice(i, 1);
  }
}
function spawnDeathParticles(e) {
  const fx = CONFIG.fx;
  const map = {
    normal: [fx.particlesNormal, 1, 1],
    green:  [fx.particlesNormal + 3, 1.1, 1.1],
    blue:   [fx.particlesNormal + 6, 1.2, 1.15],
    elite:  [fx.particlesElite, 1.25, 1.2],
    boss:   [fx.particlesBoss, 1.8, 1.7]
  };
  const cfg = map[e.type] || map.normal;
  const count = cfg[0], speedMul = cfg[1], sizeMul = cfg[2];
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = fx.particleSpeed * (0.3 + Math.random() * 0.95) * speedMul;
    const life = fx.particleLife * (0.6 + Math.random() * 0.7);
    particles.push({
      x: e.x + (Math.random() - 0.5) * e.r * 0.6,
      y: e.y + (Math.random() - 0.5) * e.r * 0.6,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: life, maxLife: life,
      size: (2 + Math.random() * 3.5) * sizeMul, color: e.color
    });
  }
  if (particles.length > fx.maxParticles) particles.splice(0, particles.length - fx.maxParticles);
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    const damp = Math.exp(-4.5 * dt);
    p.vx *= damp; p.vy *= damp;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function triggerShake(strength) {
  game.shakeTimer = CONFIG.fx.shakeTime;
  game.shakeStrength = Math.max(game.shakeStrength, strength);
}
function triggerVignette() { game.vignetteTimer = CONFIG.fx.vignetteLife; }

function damageEnemy(e, baseDamage, dirX, dirY, canCrit) {
  let dmg = baseDamage;
  let crit = false;
  if (canCrit && Math.random() < CONFIG.fx.critChance) { dmg *= CONFIG.fx.critMul; crit = true; }
  e.hp -= dmg;
  e.hitFlash = CONFIG.fx.hitFlashTime;
  let kb = CONFIG.fx.knockbackNormal;
  if (e.type === 'elite') kb = CONFIG.fx.knockbackElite;
  else if (e.type === 'boss') kb = CONFIG.fx.knockbackBoss;
  const len = Math.hypot(dirX, dirY) || 1;
  e.kbX += (dirX / len) * kb;
  e.kbY += (dirY / len) * kb;
  addDamageNumber(e.x, e.y - e.r * 0.7, dmg, crit);
  AudioSys.sfxHit();
  if (e.hp <= 0) { killEnemy(e); return true; }
  return false;
}
function killEnemy(e) {
  const idx = enemies.indexOf(e);
  if (idx === -1) return;
  enemies.splice(idx, 1);
  game.killCount++;
  if (e.type === 'elite') game.eliteKills++;
  else if (e.type === 'boss') game.bossKills++;
  else if (e.type === 'green') game.greenKills++;
  else if (e.type === 'blue') game.blueKills++;
  else game.normalKills++;
  spawnDeathParticles(e);
  AudioSys.sfxKill();
  spawnXpBall(e.x, e.y, CONFIG.enemy[e.type].xp);
  if (e.type === 'boss') { game.boss = null; gameOver(true); }
}

/* =========================================================
   13. 玩家更新
   ========================================================= */
function updatePlayer(dt) {
  if (player.dashInvuln > 0) { player.dashInvuln -= dt; if (player.dashInvuln < 0) player.dashInvuln = 0; }
  if (player.dashing) {
    player.dashT -= dt;
    const step = player.dashSpeed * dt;
    player.x += player.dashDirX * step;
    player.y += player.dashDirY * step;
    spawnDashTrail();
    if (player.dashT <= 0) player.dashing = false;
  } else {
    const mv = getMoveVector();
    const speedPx = CONFIG.player.speed * player.moveSpeedMul * CONFIG.SPEED_SCALE;
    player.x += mv.x * speedPx * dt;
    player.y += mv.y * speedPx * dt;
  }
  cam.x = player.x; cam.y = player.y;

  if (player.dashCharges < player.dashMaxCharges) {
    if (player.dashRecharge <= 0) player.dashRecharge = CONFIG.dash.cooldown;
    player.dashRecharge -= dt;
    let recovered = false;
    while (player.dashRecharge <= 0 && player.dashCharges < player.dashMaxCharges) {
      player.dashCharges++;
      player.dashRecharge += CONFIG.dash.cooldown;
      recovered = true;
    }
    if (player.dashCharges >= player.dashMaxCharges) player.dashRecharge = 0;
    if (recovered) updateDashUI(true);
  } else { player.dashRecharge = 0; }

  if (player.invincible > 0) { player.invincible -= dt; if (player.invincible < 0) player.invincible = 0; }

  player.shootTimer -= dt;
  if (player.shootTimer <= 0) {
    if (fireAtNearest()) player.shootTimer = Math.max(0.08, CONFIG.player.attackInterval / player.attackSpeedMul);
    else player.shootTimer = 0;
  }

  if (player.beamLevel > 0) {
    player.beamTimer -= dt;
    if (player.beamTimer <= 0 && fireBeam()) player.beamTimer = CONFIG.beam.interval;
  }
}

/* =========================================================
   14. 射击 / 子弹
   ========================================================= */
function fireAtNearest() {
  let target = null, minD2 = Infinity;
  if (chest.active) {
    const dx = chest.x - player.x, dy = chest.y - player.y;
    const d2 = dx * dx + dy * dy;
    if (d2 <= CONFIG.chest.aimRange * CONFIG.chest.aimRange) { target = chest; minD2 = d2; }
  }
  if (!target) {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dx = e.x - player.x, dy = e.y - player.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < minD2) { minD2 = d2; target = e; }
    }
  }
  if (!target) return false;

  const baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
  const count = player.bulletCount;
  const spread = 0.13;
  const speed = CONFIG.player.bulletSpeed;
  const dmg = CONFIG.player.bulletDamage * player.damageMul;
  for (let k = 0; k < count; k++) {
    const ang = baseAngle + (k - (count - 1) / 2) * spread;
    const cosA = Math.cos(ang), sinA = Math.sin(ang);
    bullets.push({
      x: player.x + cosA * (player.r + 4),
      y: player.y + sinA * (player.r + 4),
      vx: cosA * speed, vy: sinA * speed,
      r: CONFIG.player.bulletRadius,
      damage: dmg, pierceLeft: player.pierce,
      hitIds: new Set(), life: CONFIG.player.bulletLife
    });
  }
  AudioSys.sfxShoot();
  return true;
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0) bullets.splice(i, 1);
  }
}

function updateBulletHits() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let remove = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (b.hitIds.has(e.id)) continue;
      const dx = e.x - b.x, dy = e.y - b.y;
      const rr = e.r + b.r;
      if (dx*dx + dy*dy > rr*rr) continue;
      b.hitIds.add(e.id);
      damageEnemy(e, b.damage, b.vx, b.vy, true);
      if (b.pierceLeft > 0) b.pierceLeft--;
      else { remove = true; break; }
    }
    if (!remove && chest.active && !b.hitIds.has('chest')) {
      const dx = chest.x - b.x, dy = chest.y - b.y;
      const rr = chest.r + b.r;
      if (dx*dx + dy*dy <= rr*rr) {
        b.hitIds.add('chest');
        damageChest(b.damage, b.vx, b.vy, true);
        if (b.pierceLeft > 0) b.pierceLeft--;
        else remove = true;
      }
    }
    if (remove) bullets.splice(i, 1);
  }
}

/* =========================================================
   15. 敌人
   ========================================================= */
function spawnEnemy(type) {
  const conf = CONFIG.enemy[type];
  const diff = CONFIG.difficulty[game.diffKey];
  const halfDiag = Math.hypot(view.w, view.h) / 2;
  const dist = halfDiag + CONFIG.spawn.offscreenPadding * (1 + Math.random());
  const ang = Math.random() * Math.PI * 2;
  let maxHp;
  if (type === 'boss' && conf.hpByDiff && conf.hpByDiff[game.diffKey] != null) maxHp = conf.hpByDiff[game.diffKey];
  else maxHp = conf.hp * diff.hpMul;
  const e = {
    id: enemyIdCounter++, type: type,
    x: cam.x + Math.cos(ang) * dist,
    y: cam.y + Math.sin(ang) * dist,
    r: conf.radius,
    hp: maxHp, maxHp: maxHp,
    speed: conf.speed * diff.speedMul * CONFIG.SPEED_SCALE,
    damage: conf.damage, color: conf.color,
    hitFlash: 0, kbX: 0, kbY: 0, bladeCd: 0,
    dashing: false, dashT: 0, dashCd: CONFIG.dash.cooldown,
    dashDirX: 0, dashDirY: 0, dashSpeed: 0
  };
  enemies.push(e);
  if (type === 'boss') game.boss = e;
  return e;
}

function updateEnemies(dt) {
  const frozen = game.freezeTimer > 0;   // 冻结期间全场怪物停止活动
  /* Hell 开局 5 分钟后，所有怪再加速 0.2 倍 */
  const boost = (game.diffKey === 'hell' && game.time >= CONFIG.hellBoost.startTime)
    ? 1 + CONFIG.hellBoost.speedAdd : 1;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy);
    if (!frozen) {
      if (e.type === 'boss') updateBossDash(e, dt, d, dx, dy);
      if (e.dashing) {
        e.x += e.dashDirX * e.dashSpeed * dt;
        e.y += e.dashDirY * e.dashSpeed * dt;
      } else if (d > 0.0001) {
        const sp = e.speed * boost * dt;
        e.x += (dx / d) * sp;
        e.y += (dy / d) * sp;
      }
      if (e.kbX !== 0 || e.kbY !== 0) {
        e.x += e.kbX * dt; e.y += e.kbY * dt;
        const damp = Math.exp(-11 * dt);
        e.kbX *= damp; e.kbY *= damp;
        if (Math.abs(e.kbX) < 1) e.kbX = 0;
        if (Math.abs(e.kbY) < 1) e.kbY = 0;
      }
    }
    if (e.hitFlash > 0) { e.hitFlash -= dt; if (e.hitFlash < 0) e.hitFlash = 0; }
    if (e.bladeCd > 0) { e.bladeCd -= dt; if (e.bladeCd < 0) e.bladeCd = 0; }
  }
}

/* =========================================================
   Boss 冲刺：距离 / 时长 / 冷却与玩家完全一致
   ========================================================= */
function updateBossDash(e, dt, dist, dx, dy) {
  const dashCfg = CONFIG.boss.dash;

  if (e.dashing) {
    e.dashT -= dt;
    spawnBossTrail(e);
    if (e.dashT <= 0) { e.dashing = false; e.dashT = 0; }
    return;
  }

  e.dashCd -= dt;
  if (!dashCfg.enabled || e.dashCd > 0) return;
  if (dist < 0.0001) return;

  /* 冲刺距离固定 200，太近就会冲过头，所以只在拉开足够距离时发动 */
  const minDist = CONFIG.dash.distance + e.r + player.r;
  if (dist < minDist) return;

  e.dashing = true;
  e.dashT = CONFIG.dash.duration;
  e.dashSpeed = CONFIG.dash.distance / CONFIG.dash.duration;
  e.dashDirX = dx / dist;
  e.dashDirY = dy / dist;
  e.dashCd = CONFIG.dash.cooldown;
  AudioSys.sfxBossDash();
}

function spawnBossTrail(e) {
  const cfg = CONFIG.boss.dash;
  dashTrails.push({
    x: e.x, y: e.y, r: e.r * 0.82,
    life: cfg.trailLife, maxLife: cfg.trailLife,
    color: cfg.trailColor, alpha: cfg.trailAlpha
  });
  if (dashTrails.length > 40) dashTrails.shift();
}

/* =========================================================
   14.5 碰撞体积
   ========================================================= */
function bodyMass(e) {
  const m = CONFIG.collision.masses[e.type];
  return m == null ? 1 : m;
}

/* 把两个圆分开：质量越大，越不容易被推动；返回是否发生了移动 */
function resolveCirclePair(a, aMass, b, bMass, relax) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const minDist = a.r + b.r;
  const d2 = dx*dx + dy*dy;
  if (d2 >= minDist * minDist) return false;

  let d = Math.sqrt(d2);
  let nx, ny;
  if (d < 0.0001) {
    /* 完全重合时随机挑个方向分开，避免除零 */
    const ang = Math.random() * Math.PI * 2;
    nx = Math.cos(ang); ny = Math.sin(ang); d = 0.0001;
  } else {
    nx = dx / d; ny = dy / d;
  }

  const overlap = (minDist - d) * relax;
  const invA = 1 / Math.max(0.001, aMass);
  const invB = 1 / Math.max(0.001, bMass);
  const shareA = invA / (invA + invB);

  a.x -= nx * overlap * shareA;
  a.y -= ny * overlap * shareA;
  b.x += nx * overlap * (1 - shareA);
  b.y += ny * overlap * (1 - shareA);
  return true;
}

/* 怪物之间的一遍分离：空间网格找邻居，返回处理了多少对 */
function resolveEnemyPass() {
  const cfg = CONFIG.collision;
  if (enemies.length < 2) return 0;
  const cellSize = cfg.gridSize;

  const grid = new Map();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const key = Math.floor(e.x / cellSize) + ',' + Math.floor(e.y / cellSize);
    let bucket = grid.get(key);
    if (!bucket) { bucket = []; grid.set(key, bucket); }
    bucket.push(e);
  }

  let hits = 0;
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    const acx = Math.floor(a.x / cellSize);
    const acy = Math.floor(a.y / cellSize);
    const aMass = bodyMass(a);
    for (let gx = -1; gx <= 1; gx++) {
      for (let gy = -1; gy <= 1; gy++) {
        const bucket = grid.get((acx + gx) + ',' + (acy + gy));
        if (!bucket) continue;
        for (let j = 0; j < bucket.length; j++) {
          const b = bucket[j];
          if (b.id <= a.id) continue;      // 每对只处理一次
          if (resolveCirclePair(a, aMass, b, bodyMass(b), cfg.relax)) hits++;
        }
      }
    }
  }
  return hits;
}

/* 玩家与怪物之间的一遍分离 */
function resolvePlayerPass() {
  const cfg = CONFIG.collision;
  const playerMass = cfg.playerMass;
  let hits = 0;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (resolveCirclePair(player, playerMass, e, bodyMass(e), cfg.relax)) hits++;
  }
  return hits;
}

/* 迭代求解：没有任何重叠就提前结束，省性能 */
function resolveGuardPass() {
  if (!guard.active) return 0;
  const cfg = CONFIG.collision;
  let hits = 0;
  for (let i = 0; i < enemies.length; i++) {
    if (resolveCirclePair(guard, 40, enemies[i], bodyMass(enemies[i]), cfg.relax)) hits++;
  }
  return hits;
}

function resolveCollisions() {
  const cfg = CONFIG.collision;
  if (!cfg.enabled) return;
  for (let iter = 0; iter < cfg.iterations; iter++) {
    const playerHits = resolvePlayerPass();
    const guardHits = resolveGuardPass();
    const enemyHits = resolveEnemyPass();
    if (playerHits === 0 && guardHits === 0 && enemyHits === 0) break;
  }
}

/* 按时间权重抽怪种 */
function pickEnemyType() {
  const mix = CONFIG.spawn.mix;
  let row = mix[0];
  for (let i = 0; i < mix.length; i++) if (game.time >= mix[i].at) row = mix[i];
  let total = 0;
  for (const k in row) if (k !== 'at') total += row[k];
  if (total <= 0) return 'normal';
  let r = Math.random() * total;
  for (const k in row) {
    if (k === 'at') continue;
    r -= row[k];
    if (r < 0) return k;
  }
  return 'normal';
}

function updateSpawner(dt) {
  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) {
    const steps = Math.floor(game.time / CONFIG.spawn.rampEvery);
    game.spawnTimer = Math.max(CONFIG.spawn.minInterval,
      CONFIG.spawn.interval * Math.pow(CONFIG.spawn.rampMul, steps));
    if (enemies.length < CONFIG.spawn.maxEnemies) spawnEnemy(pickEnemyType());
  }
  if (game.time >= CONFIG.elite.startTime) {
    if (!game.eliteStarted) { game.eliteStarted = true; game.eliteTimer = 0; }
    game.eliteTimer -= dt;
    if (game.eliteTimer <= 0) {
      const steps = Math.floor((game.time - CONFIG.elite.startTime) / CONFIG.elite.rampEvery);
      game.eliteTimer = Math.max(CONFIG.elite.minInterval,
        CONFIG.elite.baseInterval * Math.pow(CONFIG.elite.rampMul, steps));
      if (enemies.length < CONFIG.spawn.maxEnemies) spawnEnemy('elite');
    }
  }
  /* Boss 出现时间按难度区分 */
  const bossAt = CONFIG.boss.spawnAtByDiff[game.diffKey] != null
    ? CONFIG.boss.spawnAtByDiff[game.diffKey]
    : CONFIG.boss.spawnAtByDiff.hell;

  if (!game.bossWarned && game.time >= bossAt - CONFIG.fx.bossWarnTime) {
    game.bossWarned = true;
    game.bossWarningTimer = CONFIG.fx.bossWarnTime;
    game.bossFlashTimer = CONFIG.fx.bossFlashTime;
    AudioSys.sfxBossWarn();
  }
  if (!game.bossSpawned && game.time >= bossAt) {
    game.bossSpawned = true;
    spawnEnemy('boss');
  }
}

/* =========================================================
   16. 经验球
   ========================================================= */
function xpColorOf(v) {
  return v >= 30 ? '#ffd166' : v >= 10 ? '#c9a3ff' : v >= 5 ? '#7fd4ff' : '#7dffa8';
}
function spawnXpBall(x, y, value) {
  const base = CONFIG.xp.ballRadius;
  xpBalls.push({
    x: x + (Math.random() - 0.5) * 12,
    y: y + (Math.random() - 0.5) * 12,
    r: base * (0.85 + Math.min(1.0, value * 0.04)),
    value: value, color: xpColorOf(value),
    speed: 0, magnetized: false,
    pulse: Math.random() * 6.28
  });
}
function updateXpBalls(dt) {
  if (game.xpComboTimer > 0) {
    game.xpComboTimer -= dt;
    if (game.xpComboTimer <= 0) { game.xpComboTimer = 0; game.xpCombo = 0; }
  }
  const range = player.pickupRange;
  for (let i = xpBalls.length - 1; i >= 0; i--) {
    const b = xpBalls[i];
    let dx = player.x - b.x, dy = player.y - b.y;
    let dist = Math.hypot(dx, dy);
    if (dist < range) b.magnetized = true;
    if (b.magnetized) {
      b.speed = Math.min(b.speed + CONFIG.xp.magnetAccel * dt, CONFIG.xp.magnetMaxSpeed);
      if (dist > 0.001) { b.x += (dx/dist) * b.speed * dt; b.y += (dy/dist) * b.speed * dt; }
    }
    dx = player.x - b.x; dy = player.y - b.y;
    dist = Math.hypot(dx, dy);
    if (dist < player.r + b.r + 10) {
      xpBalls.splice(i, 1);
      player.xp += b.value * player.xpGainMul;
      game.xpCombo = game.xpComboTimer > 0 ? Math.min(game.xpCombo + 1, CONFIG.fx.xpMaxStep) : 0;
      game.xpComboTimer = CONFIG.fx.xpComboWindow;
      AudioSys.sfxXp(game.xpCombo);
      while (player.xp >= player.xpToNext) {
        player.xp -= player.xpToNext;
        player.level++;
        player.xpToNext = calcXpNeeded(player.level);
        game.pendingLevelUps++;
      }
      if (game.pendingLevelUps > 0 && game.slowmoTimer <= 0 && game.state === GameState.PLAYING) {
        game.slowmoTimer = CONFIG.fx.slowmoTime;
      }
    }
  }
}

/* =========================================================
   17. 环绕飞刀
   ========================================================= */
function updateOrbitBlades(dt) {
  if (player.orbitBladeCount <= 0) return;
  game.bladeAngle += dt * CONFIG.blade.spinSpeed;
  const orbitR = CONFIG.blade.baseRadius + player.orbitBladeCount * CONFIG.blade.radiusPerBlade;
  const bladeR = CONFIG.blade.hitRadius;
  const bladeDmg = CONFIG.blade.damage * player.damageMul;
  for (let i = 0; i < player.orbitBladeCount; i++) {
    const ang = game.bladeAngle + (i / player.orbitBladeCount) * Math.PI * 2;
    const bx = player.x + Math.cos(ang) * orbitR;
    const by = player.y + Math.sin(ang) * orbitR;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (e.bladeCd > 0) continue;
      const dx = e.x - bx, dy = e.y - by;
      const rr = e.r + bladeR;
      if (dx*dx + dy*dy > rr*rr) continue;
      e.bladeCd = CONFIG.blade.cooldown;
      damageEnemy(e, bladeDmg, dx, dy, true);
    }
    if (chest.active && chest.bladeCd <= 0) {
      const dx = chest.x - bx, dy = chest.y - by;
      const rr = chest.r + bladeR;
      if (dx*dx + dy*dy <= rr*rr) {
        chest.bladeCd = CONFIG.blade.cooldown;
        damageChest(bladeDmg, dx, dy, true);
      }
    }
  }
}

/* =========================================================
   17.5 强力攻击（直线光束）
   ========================================================= */
function fireBeam() {
  const c = CONFIG.beam;
  let target = null, best = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const dx = e.x - player.x, dy = e.y - player.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < best) { best = d2; target = e; }
  }
  if (!target) return false;

  const ang = Math.atan2(target.y - player.y, target.x - player.x);
  const cos = Math.cos(ang), sin = Math.sin(ang);
  beams.push({ x: player.x, y: player.y,
    ex: player.x + cos * c.length, ey: player.y + sin * c.length,
    life: c.life, maxLife: c.life });

  const dmg = c.damage * (1 + (player.beamLevel - 1) * c.damagePerLevel) * player.damageMul;
  const halfW = c.width * 0.5;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const px = e.x - player.x, py = e.y - player.y;
    const proj = px * cos + py * sin;
    if (proj < 0 || proj > c.length) continue;
    if (Math.abs(-px * sin + py * cos) > e.r + halfW) continue;
    damageEnemy(e, dmg, cos, sin, true);
  }
  if (chest.active) {
    const px = chest.x - player.x, py = chest.y - player.y;
    const proj = px * cos + py * sin;
    if (proj > 0 && proj < c.length && Math.abs(-px * sin + py * cos) <= chest.r + halfW) {
      damageChest(dmg, cos, sin, true);
    }
  }
  AudioSys.sfxBeam();
  return true;
}

function updateBeams(dt) {
  for (let i = beams.length - 1; i >= 0; i--) {
    beams[i].life -= dt;
    if (beams[i].life <= 0) beams.splice(i, 1);
  }
}

function drawBeams() {
  const c = CONFIG.beam;
  ctx.lineCap = 'round';
  for (let i = 0; i < beams.length; i++) {
    const b = beams[i];
    const k = Math.max(0, b.life / b.maxLife);
    ctx.globalAlpha = k;
    ctx.strokeStyle = 'rgba(255,232,120,0.75)';
    ctx.lineWidth = c.width * (0.6 + 0.4 * k);
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.ex, b.ey); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.lineWidth = c.width * 0.3 * k;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.ex, b.ey); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineCap = 'butt';
}

/* =========================================================
   17.6 护卫
   ========================================================= */
function guardDamage() {
  if (player.guardLevel <= 0) return 0;
  const c = CONFIG.guard;
  return CONFIG.player.bulletDamage * player.damageMul
    * (c.damageBase + (player.guardLevel - 1) * c.damageStep);
}

function spawnGuard() {
  const c = CONFIG.guard;
  guard.active = true;
  guard.r = c.radius;
  guard.x = player.x - c.followDist;
  guard.y = player.y + c.followDist * 0.6;
  guard.shootTimer = 0.3;
}

function updateGuard(dt) {
  if (!guard.active) return;
  const c = CONFIG.guard;

  const dx = player.x - guard.x, dy = player.y - guard.y;
  const d = Math.hypot(dx, dy);
  const keep = c.followDist * 0.65;
  if (d > keep && d > 0.0001) {
    /* 距离越远追得越快，接近时平滑减速，不会一顿一顿 */
    const want = Math.min(c.speed, (d - keep) * 7);
    const step = want * dt;
    guard.x += (dx / d) * step;
    guard.y += (dy / d) * step;
  }

  guard.shootTimer -= dt;
  if (guard.shootTimer > 0) return;

  let target = null, best = c.range * c.range;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const ex = e.x - guard.x, ey = e.y - guard.y;
    const d2 = ex*ex + ey*ey;
    if (d2 < best) { best = d2; target = e; }
  }
  if (!target) { guard.shootTimer = 0.15; return; }

  const ang = Math.atan2(target.y - guard.y, target.x - guard.x);
  bullets.push({
    x: guard.x + Math.cos(ang) * (guard.r + 3),
    y: guard.y + Math.sin(ang) * (guard.r + 3),
    vx: Math.cos(ang) * c.bulletSpeed, vy: Math.sin(ang) * c.bulletSpeed,
    r: CONFIG.player.bulletRadius * 0.8,
    damage: guardDamage(), pierceLeft: player.pierce,
    hitIds: new Set(), life: CONFIG.player.bulletLife, color: '#7dffa8'
  });
  guard.shootTimer = c.attackInterval;
  AudioSys.sfxShoot();
}

function drawGuard() {
  if (!guard.active) return;
  ctx.beginPath();
  ctx.arc(guard.x, guard.y, guard.r + 5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(125,255,168,0.16)'; ctx.fill();
  ctx.beginPath();
  ctx.arc(guard.x, guard.y, guard.r, 0, Math.PI * 2);
  ctx.fillStyle = '#2ec27e'; ctx.fill();
  ctx.strokeStyle = 'rgba(190,255,225,0.85)'; ctx.lineWidth = 2; ctx.stroke();
}

/* =========================================================
   18. 玩家受伤
   ========================================================= */
function updatePlayerDamage() {
  if (game.freezeTimer > 0) return;   // 冻结期间怪物无法攻击
  if (player.invincible > 0 || player.dashInvuln > 0) return;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const dx = e.x - player.x, dy = e.y - player.y;
    const rr = e.r + player.r + CONFIG.collision.contactPad;
    if (dx*dx + dy*dy > rr*rr) continue;

    /* 护盾先吃伤害，吃完了剩下的才扣血 */
    let dmg = e.damage;
    if (player.shield > 0) {
      const absorbed = Math.min(player.shield, dmg);
      player.shield -= absorbed;
      dmg -= absorbed;
      showFloatingText(player.x, player.y - player.r - 12,
        '护盾 -' + Math.round(absorbed), CONFIG.chest.shieldTextColor);
      if (player.shield <= 0) {
        player.shield = 0;
        showFloatingText(player.x, player.y - player.r - 30, '护盾破碎', '#ff9ec4');
      }
    }

    if (dmg > 0) player.hp -= dmg;
    player.invincible = CONFIG.player.invincibleTime;
    game.hurtFlash = 0.25;
    triggerVignette();
    triggerShake(e.type === 'boss' ? CONFIG.fx.shakeBoss : CONFIG.fx.shakeNormal);
    AudioSys.sfxHurt();
    if (player.hp <= 0) { player.hp = 0; gameOver(false); }
    break;
  }
}

/* =========================================================
   19. 宝箱系统
   ========================================================= */
function trySpawnChest() {
  const chestR = CONFIG.chest.radius;
  const halfW = view.w / 2, halfH = view.h / 2;
  const maxAllowed = Math.min(halfW, halfH) - chestR - 20;
  let dMin = CONFIG.chest.spawnDistMin;
  let dMax = CONFIG.chest.spawnDistMax;
  if (dMax > maxAllowed) dMax = maxAllowed;
  if (dMax < 80) dMax = 80;
  if (dMin > dMax * 0.7) dMin = dMax * 0.7;
  if (dMin > dMax) dMin = dMax;

  const angle = Math.random() * Math.PI * 2;
  const dist = dMin + Math.random() * (dMax - dMin);
  let cx = player.x + Math.cos(angle) * dist;
  let cy = player.y + Math.sin(angle) * dist;
  const left = player.x - halfW + chestR + 10;
  const right = player.x + halfW - chestR - 10;
  const top = player.y - halfH + chestR + 10;
  const bottom = player.y + halfH - chestR - 10;
  cx = Math.max(left, Math.min(right, cx));
  cy = Math.max(top, Math.min(bottom, cy));
  const dxp = cx - player.x, dyp = cy - player.y;
  const dp = Math.hypot(dxp, dyp);
  if (dp < 100) {
    if (dp < 1) { cx = player.x + 120; cy = player.y; }
    else { cx = player.x + (dxp / dp) * 120; cy = player.y + (dyp / dp) * 120; }
    cx = Math.max(left, Math.min(right, cx));
    cy = Math.max(top, Math.min(bottom, cy));
  }
  chest.active = true;
  chest.x = cx; chest.y = cy; chest.r = chestR;
  chest.hp = CONFIG.chest.hp; chest.maxHp = CONFIG.chest.hp;
  chest.age = 0; chest.spawnAnim = 0; chest.hitFlash = 0;
  chest.shakeTimer = 0; chest.shakeX = 0; chest.shakeY = 0; chest.bladeCd = 0;
  game.chestNotify = '宝箱出现！';
  game.chestNotifyTimer = CONFIG.chest.notifyTime;
  AudioSys.sfxChestAppear();
}

function updateChest(dt) {
  if (game.chestNotifyTimer > 0) {
    game.chestNotifyTimer -= dt;
    if (game.chestNotifyTimer < 0) game.chestNotifyTimer = 0;
  }
  if (chest.active) {
    chest.age += dt;
    if (chest.spawnAnim < 1) chest.spawnAnim = Math.min(1, chest.spawnAnim + dt / CONFIG.chest.spawnAnimTime);
    if (chest.hitFlash > 0) { chest.hitFlash -= dt; if (chest.hitFlash < 0) chest.hitFlash = 0; }
    if (chest.shakeTimer > 0) {
      chest.shakeTimer -= dt;
      if (chest.shakeTimer < 0) chest.shakeTimer = 0;
      const k = chest.shakeTimer / CONFIG.chest.shakeTime;
      chest.shakeX = (Math.random() - 0.5) * 2 * CONFIG.chest.shakeAmp * k;
      chest.shakeY = (Math.random() - 0.5) * 2 * CONFIG.chest.shakeAmp * k;
    } else { chest.shakeX = 0; chest.shakeY = 0; }
    if (chest.bladeCd > 0) { chest.bladeCd -= dt; if (chest.bladeCd < 0) chest.bladeCd = 0; }
    if (chest.age >= CONFIG.chest.lifetime) despawnChest(true);
    return;
  }
  if (game.time < game.chestNextTime) return;
  if (CONFIG.chest.stopAfterBoss && game.bossSpawned) return;
  if (!CONFIG.chest.maxAlive || CONFIG.chest.maxAlive < 1) return;
  trySpawnChest();
}

function damageChest(damage, dirX, dirY, canCrit) {
  if (!chest.active) return;
  let dmg = damage, crit = false;
  if (canCrit && Math.random() < CONFIG.fx.critChance) { dmg *= CONFIG.fx.critMul; crit = true; }
  chest.hp -= dmg;
  chest.hitFlash = CONFIG.chest.hitFlashTime;
  chest.shakeTimer = CONFIG.chest.shakeTime;
  addDamageNumber(chest.x, chest.y - chest.r * 0.8, dmg, crit);
  AudioSys.sfxChestHit();
  if (chest.hp <= 0) breakChest();
}

/* 抽奖励：四种各 25% */
function rollChestReward() {
  const w = CONFIG.chest.rewardWeights || {};
  const keys = ['levelUp', 'heal', 'shield', 'freeze'];
  let total = 0;
  for (let i = 0; i < keys.length; i++) total += Math.max(0, w[keys[i]] || 0);
  if (total <= 0) return 'levelUp';
  let roll = Math.random() * total;
  for (let i = 0; i < keys.length; i++) {
    roll -= Math.max(0, w[keys[i]] || 0);
    if (roll < 0) return keys[i];
  }
  return keys[keys.length - 1];
}

function breakChest() {
  if (!chest.active) return;
  const cx = chest.x, cy = chest.y;
  spawnChestBreakParticles(cx, cy);
  AudioSys.sfxChestBreak();
  game.chestBreakCount++;
  const reward = rollChestReward();

  if (reward === 'levelUp') {
    player.level++;
    player.xpToNext = calcXpNeeded(player.level);
    game.pendingLevelUps++;
    if (game.slowmoTimer <= 0) game.slowmoTimer = CONFIG.fx.slowmoTime;
    showFloatingText(cx, cy, '升级！', CONFIG.chest.rewardTextColor);
  } else if (reward === 'heal') {
    /* 已经满血就什么都不做，无事发生 */
    if (player.hp < player.maxHp) {
      player.hp = player.maxHp;
      healEffects.push({ x: player.x, y: player.y,
        life: CONFIG.chest.healRingLife, maxLife: CONFIG.chest.healRingLife,
        color: CONFIG.chest.healRingColor });
      showFloatingText(cx, cy, '生命回满！', CONFIG.chest.healTextColor);
    }
  } else if (reward === 'shield') {
    player.shield += CONFIG.chest.shieldAmount;
    healEffects.push({ x: player.x, y: player.y,
      life: CONFIG.chest.healRingLife, maxLife: CONFIG.chest.healRingLife,
      color: CONFIG.chest.shieldRingColor });
    showFloatingText(cx, cy, '护盾 +' + CONFIG.chest.shieldAmount, CONFIG.chest.shieldTextColor);
  } else {
    game.freezeTimer = CONFIG.chest.freezeDuration;
    showFloatingText(cx, cy, '全场冻结 ' + CONFIG.chest.freezeDuration + ' 秒！', CONFIG.chest.freezeTextColor);
  }

  chest.active = false; chest.age = 0;
  game.chestNextTime = game.time + CONFIG.chest.respawnDelay;
}

function despawnChest(timedOut) {
  if (!chest.active) return;
  if (timedOut) spawnChestFadeParticles(chest.x, chest.y);
  chest.active = false; chest.age = 0;
  game.chestNextTime = game.time + CONFIG.chest.respawnDelay;
}

function spawnChestBreakParticles(x, y) {
  const count = CONFIG.chest.breakParticles;
  const speed = CONFIG.chest.breakParticleSpeed;
  const life = CONFIG.chest.breakParticleLife;
  const color = CONFIG.chest.breakParticleColor;
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = speed * (0.4 + Math.random() * 0.9);
    const l = life * (0.7 + Math.random() * 0.6);
    particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: l, maxLife: l, size: 3 + Math.random() * 4, color: color });
  }
  if (particles.length > CONFIG.fx.maxParticles) particles.splice(0, particles.length - CONFIG.fx.maxParticles);
}

function spawnChestFadeParticles(x, y) {
  const count = Math.floor(CONFIG.chest.breakParticles * 0.4);
  const speed = CONFIG.chest.breakParticleSpeed * 0.5;
  const life = CONFIG.chest.breakParticleLife * 0.8;
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = speed * (0.3 + Math.random() * 0.7);
    const l = life * (0.6 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: l, maxLife: l, size: 2 + Math.random() * 3, color: '#b0b8c8' });
  }
}

function showFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, vy: -40, text, color,
    life: CONFIG.chest.rewardTextLife, maxLife: CONFIG.chest.rewardTextLife,
    size: CONFIG.chest.rewardTextSize });
}

function updateFloatingTexts(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy * dt;
    t.vy *= Math.exp(-3 * dt);
    t.life -= dt;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function updateHealEffects(dt) {
  for (let i = healEffects.length - 1; i >= 0; i--) {
    healEffects[i].life -= dt;
    if (healEffects[i].life <= 0) healEffects.splice(i, 1);
  }
}

/* =========================================================
   20. 结算
   ========================================================= */
/* 本局得分：普通怪 / 精英怪 / 存活秒数，规则不对外展示 */
function computeScore() {
  const r = CONFIG.score;
  return game.normalKills * r.normalKill
       + game.greenKills * r.greenKill
       + game.blueKills * r.blueKill
       + game.eliteKills * r.eliteKill
       + game.bossKills * r.bossKill
       + Math.floor(game.time) * r.perSecond;
}

function gameOver(victory) {
  if (game.state === GameState.GAMEOVER) return;
  game.shakeTimer = 0; game.shakeStrength = 0;
  game.vignetteTimer = 0; game.bossFlashTimer = 0;
  game.bossWarningTimer = 0; game.slowmoTimer = 0;

  game.score = computeScore();
  Save.record(game.diffKey, game.time, game.killCount, victory);
  document.getElementById('stat-diff').textContent = CONFIG.difficulty[game.diffKey].label;
  document.getElementById('stat-time').textContent = game.time.toFixed(1);
  document.getElementById('stat-kills').textContent = String(game.killCount);
  document.getElementById('stat-level').textContent = String(player.level);
  document.getElementById('stat-chests').textContent = String(game.chestBreakCount);
  document.getElementById('stat-score').textContent = String(game.score);
  renderUpgradeLog();

  const title = document.getElementById('gameover-title');
  if (victory) {
    title.textContent = '通关！';
    title.style.color = '#ffd166';
    title.style.textShadow = '0 0 18px rgba(255,210,80,.6)';
  } else {
    title.textContent = '游戏结束';
    title.style.color = '#ff6b81';
    title.style.textShadow = '0 0 18px rgba(255,80,110,.55)';
  }

  const rankRow = document.getElementById('stat-rank-row');
  const scoreMsg = document.getElementById('stat-score-msg');
  rankRow.classList.add('hidden');
  scoreMsg.classList.add('hidden');
  scoreMsg.textContent = '';

  setState(GameState.GAMEOVER);
  victory ? AudioSys.sfxWin() : AudioSys.sfxLose();

  if (game.diffKey === 'hell') submitHellScore(game.time, game.killCount);
  else syncProgressAsync();
}

async function submitHellScore(time, kills) {
  const rankRow = document.getElementById('stat-rank-row');
  const rankEl = document.getElementById('stat-rank');
  const scoreMsg = document.getElementById('stat-score-msg');

  const payload = {
    difficulty: 'hell',
    time: time,
    normalKills: game.normalKills,
    greenKills: game.greenKills,
    blueKills: game.blueKills,
    eliteKills: game.eliteKills,
    bossKills: game.bossKills
  };

  if (!Auth.isLoggedIn()) {
    rankRow.classList.add('hidden');
    scoreMsg.textContent = '离线模式，成绩不上榜';
    scoreMsg.classList.remove('hidden');
    return;
  }

  rankRow.classList.remove('hidden');
  rankEl.textContent = '提交中…';

  try {
    const r = await apiFetch('/api/score', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    if (r.status === 200) {
      rankEl.textContent = '第 ' + r.data.rank + ' 名';
      scoreMsg.textContent = r.data.improved
        ? '🏆 刷新了个人最高分！'
        : '未超过个人最佳（' + r.data.best.score + ' 分）';
      scoreMsg.classList.remove('hidden');
    } else if (r.status === 401) {
      Auth.clear();
      rankRow.classList.add('hidden');
      scoreMsg.textContent = '登录已过期，成绩暂存本地';
      scoreMsg.classList.remove('hidden');
      PendingScores.push(payload);
    } else {
      rankRow.classList.add('hidden');
      scoreMsg.textContent = '成绩暂存，联网后自动提交';
      scoreMsg.classList.remove('hidden');
      PendingScores.push(payload);
    }
  } catch (e) {
    rankRow.classList.add('hidden');
    scoreMsg.textContent = '成绩暂存，联网后自动提交';
    scoreMsg.classList.remove('hidden');
    PendingScores.push(payload);
  }
  syncProgressAsync();
}

async function syncProgressAsync() {
  if (!Auth.isLoggedIn()) return;
  try {
    await apiFetch('/api/progress', {
      method: 'PUT',
      body: JSON.stringify({ progress: Save.toProgress() })
    });
  } catch (e) {}
}

function renderUpgradeLog() {
  const el = document.getElementById('stat-upgrades');
  const log = game.upgradeLog;
  if (!log || log.length === 0) {
    el.innerHTML = '<span class="upg-empty">本局没有选择强化</span>';
    return;
  }
  const count = Object.create(null);
  const order = [];
  for (const name of log) {
    if (!count[name]) { count[name] = 0; order.push(name); }
    count[name]++;
  }
  el.innerHTML = order
    .map(n => '<span class="upg-item">' + n + (count[n] > 1 ? ' ×' + count[n] : '') + '</span>')
    .join('');
}

/* =========================================================
   21. 暂停 / 升级
   ========================================================= */
function togglePause() {
  if (game.state === GameState.PLAYING) { setState(GameState.PAUSED); AudioSys.sfxClick(); }
  else if (game.state === GameState.PAUSED) { setState(GameState.PLAYING); AudioSys.sfxClick(); }
}

function showLevelUp() {
  if (game.state !== GameState.PLAYING) return;
  const choices = getUpgradeChoices();

  /* 所有强化都满级时兜底：直接回血，避免卡在空面板 */
  if (choices.length === 0) {
    player.hp = Math.min(player.maxHp, player.hp + 5);
    game.pendingLevelUps--;
    if (game.pendingLevelUps > 0) game.slowmoTimer = CONFIG.fx.slowmoTime;
    return;
  }

  const list = document.getElementById('upgrade-list');
  list.innerHTML = '';
  choices.forEach((u, idx) => {
    const lv = upgradeLevel(u.id);
    const btn = document.createElement('button');
    btn.className = 'upgrade-btn';
    btn.style.animationDelay = (idx * 0.06) + 's';
    btn.innerHTML = '<span class="upgrade-title">' + u.name +
                    '<span class="upgrade-lv">' + (lv + 1) + '/' + u.max + '</span></span>' +
                    '<span class="upgrade-desc">' + u.desc + '</span>';
    btn.addEventListener('click', () => {
      if (game.state !== GameState.LEVELUP) return;   // 防连点重复生效
      AudioSys.init();
      AudioSys.sfxLevelUp();
      UPGRADE_LEVELS[u.id] = lv + 1;
      u.apply();
      game.upgradeLog.push(u.name);
      game.pendingLevelUps--;
      setState(GameState.PLAYING);
      updateDashUI(true);
      if (game.pendingLevelUps > 0) game.slowmoTimer = CONFIG.fx.slowmoTime;
    });
    list.appendChild(btn);
  });
  document.getElementById('levelup-sub').textContent = '等级 ' + player.level + ' · 选择一项强化';
  setState(GameState.LEVELUP);
  AudioSys.sfxLevelUp();
}

/* =========================================================
   22. 主更新
   ========================================================= */
function update(rawDt) {
  if (game.state === GameState.PAUSED) return;
  game.hurtFlash = Math.max(0, game.hurtFlash - rawDt);
  game.vignetteTimer = Math.max(0, game.vignetteTimer - rawDt);
  game.bossFlashTimer = Math.max(0, game.bossFlashTimer - rawDt);
  if (game.shakeTimer > 0) {
    game.shakeTimer = Math.max(0, game.shakeTimer - rawDt);
    if (game.shakeTimer === 0) game.shakeStrength = 0;
  }
  if (game.state !== GameState.PLAYING) return;

  let timeScale = 1;
  if (game.slowmoTimer > 0) {
    game.slowmoTimer -= rawDt;
    if (game.slowmoTimer <= 0) {
      game.slowmoTimer = 0;
      if (game.pendingLevelUps > 0) { showLevelUp(); return; }
    } else timeScale = CONFIG.fx.slowmoScale;
  }
  const dt = rawDt * timeScale;
  game.time += dt;
  if (game.bossWarningTimer > 0) game.bossWarningTimer = Math.max(0, game.bossWarningTimer - dt);
  if (game.freezeTimer > 0) game.freezeTimer = Math.max(0, game.freezeTimer - dt);

  updatePlayer(dt);
  updateGuard(dt);
  updateBullets(dt);
  updateBeams(dt);
  updateXpBalls(dt);
  updateEnemies(dt);
  resolveCollisions();
  updateChest(dt);
  updateOrbitBlades(dt);
  updateBulletHits();
  if (game.state !== GameState.PLAYING) return;
  updatePlayerDamage();
  if (game.state !== GameState.PLAYING) return;
  updateSpawner(dt);
  updateParticles(dt);
  updateDamageNumbers(dt);
  updateDashTrails(dt);
  updateFloatingTexts(dt);
  updateHealEffects(dt);
}

/* =========================================================
   23. 绘制
   ========================================================= */
function roundRect(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.arcTo(x + w, y, x + w, y + rr, rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
  ctx.lineTo(x + rr, y + h);
  ctx.arcTo(x, y + h, x, y + h - rr, rr);
  ctx.lineTo(x, y + rr);
  ctx.arcTo(x, y, x + rr, y, rr);
  ctx.closePath();
}
function panel(x, y, w, h, r, color) {
  ctx.fillStyle = color || 'rgba(4,8,16,0.55)';
  roundRect(x, y, w, h, r);
  ctx.fill();
}
function bar(x, y, w, h, ratio, bgColor, fillColor, r) {
  ctx.fillStyle = bgColor;
  roundRect(x, y, w, h, r); ctx.fill();
  const clamped = Math.max(0, Math.min(1, ratio));
  if (clamped > 0) {
    ctx.fillStyle = fillColor;
    roundRect(x, y, Math.max(2, w * clamped), h, r); ctx.fill();
  }
}
function inView(x, y, margin) {
  const m = margin || 90;
  return x > cam.x - view.w / 2 - m && x < cam.x + view.w / 2 + m &&
         y > cam.y - view.h / 2 - m && y < cam.y + view.h / 2 + m;
}
function drawLines(gap, color, width) {
  const left = cam.x - view.w / 2;
  const right = cam.x + view.w / 2;
  const top = cam.y - view.h / 2;
  const bottom = cam.y + view.h / 2;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  for (let x = Math.floor(left / gap) * gap; x <= right; x += gap) { ctx.moveTo(x, top); ctx.lineTo(x, bottom); }
  for (let y = Math.floor(top / gap) * gap; y <= bottom; y += gap) { ctx.moveTo(left, y); ctx.lineTo(right, y); }
  ctx.stroke();
}
function drawGrid() {
  const g = CONFIG.world.gridSize;
  drawLines(g, '#16203a', 1);
  drawLines(g * 5, '#1e2c4d', 2);
}
function drawEnemyShape(e, fill, stroke) {
  if (e.type === 'elite') {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = fill;
    ctx.fillRect(-e.r, -e.r, e.r * 2, e.r * 2);
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; ctx.strokeRect(-e.r, -e.r, e.r * 2, e.r * 2); }
    ctx.restore();
    return;
  }
  ctx.beginPath();
  ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = e.type === 'boss' ? 4 : 2; ctx.stroke(); }
}
function drawXpBalls() {
  const t = performance.now() / 1000;
  for (let i = 0; i < xpBalls.length; i++) {
    const b = xpBalls[i];
    const pulse = 1 + Math.sin(t * 6 + b.pulse) * 0.15;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * pulse + 5, 0, Math.PI * 2);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = b.color || '#7dffa8'; ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = b.color || '#7dffa8'; ctx.fill();
  }
}
function drawEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (!inView(e.x, e.y)) continue;
    if (e.type === 'boss') {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 10, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,60,60,0.14)'; ctx.fill();
    }
    const stroke = e.type === 'boss' ? '#ffd0d0'
      : e.type === 'elite' ? 'rgba(230,215,255,0.55)' : 'rgba(255,255,255,0.18)';
    drawEnemyShape(e, e.color, stroke);
    if (e.type === 'boss') {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 0.55, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3; ctx.stroke();
    }
    if (e.hitFlash > 0) drawEnemyShape(e, 'rgba(255,255,255,0.78)');
    if (game.freezeTimer > 0) drawEnemyShape(e, 'rgba(140,205,255,0.42)', 'rgba(200,235,255,0.6)');
  }
}
function drawChest() {
  if (!chest.active) return;
  const spawnK = chest.spawnAnim;
  if (spawnK <= 0) return;
  const baseScale = 0.5 + 0.5 * spawnK;
  const remaining = CONFIG.chest.lifetime - chest.age;
  let blinkAlpha = 1;
  if (remaining <= 10) blinkAlpha = 0.55 + 0.45 * Math.sin(chest.age * CONFIG.chest.last10sBlinkRate);
  const cx = chest.x + chest.shakeX;
  const cy = chest.y + chest.shakeY;
  const r = chest.r * baseScale;

  ctx.globalAlpha = 0.25 * spawnK * blinkAlpha;
  ctx.beginPath();
  ctx.arc(cx, cy, r + 10, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd166'; ctx.fill();

  ctx.globalAlpha = spawnK * blinkAlpha;
  ctx.fillStyle = '#e0a020';
  ctx.strokeStyle = '#6b3e00';
  ctx.lineWidth = 3;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);

  ctx.fillStyle = '#8b5a00';
  ctx.fillRect(cx - r * 0.25, cy - r * 0.1, r * 0.5, r * 0.6);
  ctx.fillStyle = '#fff3a0';
  ctx.fillRect(cx - r * 0.1, cy + r * 0.15, r * 0.2, r * 0.2);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(cx - r + 2, cy - r + 2, r * 0.6, r * 0.15);

  if (chest.hitFlash > 0) {
    const a = chest.hitFlash / CONFIG.chest.hitFlashTime;
    ctx.globalAlpha = a * spawnK * blinkAlpha;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  if (spawnK > 0.6) {
    ctx.globalAlpha = blinkAlpha;
    const bw = r * 2, bh = 5;
    const bx = cx - r, by = cy - r - 12;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    ctx.fillStyle = '#2a0d12'; ctx.fillRect(bx, by, bw, bh);
    const ratio = Math.max(0, chest.hp / chest.maxHp);
    if (ratio > 0) { ctx.fillStyle = '#ffd166'; ctx.fillRect(bx, by, bw * ratio, bh); }
  }
  ctx.globalAlpha = 1;
}
function drawBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,230,120,0.20)'; ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color || '#ffe066'; ctx.fill();
  }
}
function drawOrbitBlades() {
  if (player.orbitBladeCount <= 0) return;
  const count = player.orbitBladeCount;
  const orbitR = CONFIG.blade.baseRadius + count * CONFIG.blade.radiusPerBlade;
  for (let i = 0; i < count; i++) {
    const ang = game.bladeAngle + (i / count) * Math.PI * 2;
    const bx = player.x + Math.cos(ang) * orbitR;
    const by = player.y + Math.sin(ang) * orbitR;
    ctx.save();
    ctx.translate(bx, by); ctx.rotate(ang + Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(5, 0); ctx.lineTo(0, 12); ctx.lineTo(-5, 0);
    ctx.closePath();
    ctx.fillStyle = '#d0e8ff'; ctx.fill();
    ctx.strokeStyle = '#8ac4ff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }
}
function drawDashTrails() {
  for (let i = 0; i < dashTrails.length; i++) {
    const t = dashTrails[i];
    const k = Math.max(0, t.life / t.maxLife);
    ctx.globalAlpha = (t.alpha != null ? t.alpha : 0.32) * k;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r * (0.65 + 0.35 * k), 0, Math.PI * 2);
    ctx.fillStyle = t.color || '#4fc3f7'; ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawPlayer() {
  let alpha = 1;
  if (player.invincible > 0) alpha = 0.35 + 0.65 * Math.abs(Math.sin(player.invincible * 22));
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r + (player.dashing ? 10 : 6), 0, Math.PI * 2);
  ctx.fillStyle = player.dashing ? 'rgba(120,220,255,0.30)' : 'rgba(79,195,247,0.15)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fillStyle = '#4fc3f7'; ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#d8f4ff'; ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function drawDamageNumbers() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < damageNumbers.length; i++) {
    const d = damageNumbers[i];
    ctx.globalAlpha = Math.min(1, (d.life / d.maxLife) * 2.2);
    if (d.crit) {
      ctx.font = 'bold ' + Math.round(20 * CONFIG.fx.dmgNumCritScale) +
                 'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffd94a';
      ctx.strokeStyle = 'rgba(90,45,0,0.85)';
      ctx.lineWidth = 3.5;
    } else {
      ctx.font = 'bold 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = 2.5;
    }
    ctx.strokeText(d.text, d.x, d.y);
    ctx.fillText(d.text, d.x, d.y);
  }
  ctx.globalAlpha = 1;
}
function drawFloatingTexts() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < floatingTexts.length; i++) {
    const t = floatingTexts[i];
    ctx.globalAlpha = Math.min(1, (t.life / t.maxLife) * 1.5);
    ctx.font = 'bold ' + t.size + 'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.75)';
    ctx.lineWidth = 4;
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}
function drawHealEffects() {
  for (let i = 0; i < healEffects.length; i++) {
    const e = healEffects[i];
    const k = 1 - e.life / e.maxLife;
    const r = player.r + k * 60;
    ctx.globalAlpha = (1 - k) * 0.85;
    ctx.beginPath();
    ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
    ctx.strokeStyle = e.color || CONFIG.chest.healRingColor;
    ctx.lineWidth = 4;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawChestArrow() {
  if (!chest.active) return;
  const margin = 40;
  const sx = chest.x - cam.x + view.w / 2;
  const sy = chest.y - cam.y + view.h / 2;
  if (sx > margin && sx < view.w - margin && sy > margin && sy < view.h - margin) return;
  const cx = view.w / 2, cy = view.h / 2;
  const dx = sx - cx, dy = sy - cy;
  if (dx === 0 && dy === 0) return;
  const halfW = view.w / 2 - 30, halfH = view.h / 2 - 30;
  const scaleX = dx !== 0 ? halfW / Math.abs(dx) : Infinity;
  const scaleY = dy !== 0 ? halfH / Math.abs(dy) : Infinity;
  const scale = Math.min(scaleX, scaleY);
  const ax = cx + dx * scale, ay = cy + dy * scale;
  const angle = Math.atan2(dy, dx);
  const t = performance.now() / 1000;
  const a = 0.7 + 0.3 * Math.sin(t * 8);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(ax, ay); ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(16, 0); ctx.lineTo(-8, -11); ctx.lineTo(-2, 0); ctx.lineTo(-8, 11);
  ctx.closePath();
  ctx.fillStyle = CONFIG.chest.arrowColor; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function drawChestNotify() {
  if (game.chestNotifyTimer <= 0) return;
  const t = game.chestNotifyTimer / CONFIG.chest.notifyTime;
  const alpha = Math.min(1, t * 2.2);
  const y = 90;
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + Math.round(Math.min(28, view.w * 0.06)) +
             'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.strokeStyle = 'rgba(0,0,0,0.7)';
  ctx.lineWidth = 4;
  ctx.strokeText(game.chestNotify, view.w / 2, y);
  ctx.fillStyle = '#ffd166';
  ctx.fillText(game.chestNotify, view.w / 2, y);
  ctx.globalAlpha = 1;
}
function drawVignette() {
  if (game.vignetteTimer <= 0) return;
  const a = (game.vignetteTimer / CONFIG.fx.vignetteLife) * CONFIG.fx.vignetteAlpha;
  const w = view.w, h = view.h;
  const g = ctx.createRadialGradient(w/2, h/2, Math.min(w, h)*0.30, w/2, h/2, Math.max(w, h)*0.78);
  g.addColorStop(0, 'rgba(255,0,50,0)');
  g.addColorStop(1, 'rgba(255,0,50,' + a.toFixed(3) + ')');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}
function drawBossFlash() {
  if (game.bossFlashTimer <= 0) return;
  const k = game.bossFlashTimer / CONFIG.fx.bossFlashTime;
  const pulse = Math.abs(Math.sin(k * Math.PI * 3));
  const a = 0.42 * k * (0.6 + 0.4 * pulse);
  ctx.fillStyle = 'rgba(255,30,40,' + a.toFixed(3) + ')';
  ctx.fillRect(0, 0, view.w, view.h);
}
function formatTime(sec) {
  const s = Math.floor(Math.max(0, sec));
  const m = Math.floor(s / 60), r = s % 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
}
function formatTimeExact(sec) {
  const s = Math.max(0, sec);
  const m = Math.floor(s / 60), r = s - m * 60;
  const rStr = r < 10 ? '0' + r.toFixed(1) : r.toFixed(1);
  return (m < 10 ? '0' : '') + m + ':' + rStr;
}
function drawHUD() {
  const pad = 14;
  const barW = Math.min(230, Math.max(130, view.w * 0.40));
  const barH = 16;
  const font = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  const shH = 7, shY = pad + barH + 4;
  panel(pad - 6, pad - 6, barW + 12, barH + shH + 16, 8);
  const hpRatio = player.hp / player.maxHp;
  bar(pad, pad, barW, barH, hpRatio, '#2a1220', hpRatio > 0.35 ? '#ff4d6d' : '#ff2d55', 6);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px ' + font;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.ceil(player.hp) + ' / ' + player.maxHp, pad + barW / 2, pad + barH / 2 + 1);

  /* 护盾条：和血条一样是条形，叠加后条形更长 */
  const shieldMax = Math.max(CONFIG.chest.shieldCap, player.shield);
  bar(pad, shY, barW, shH, player.shield / shieldMax, 'rgba(6,20,32,0.72)', '#4fc3f7', 3);
  if (player.shield > 0) {
    ctx.font = 'bold 9px ' + font;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#bff0ff';
    ctx.fillText(String(Math.ceil(player.shield)), pad + barW - 4, shY + shH / 2 + 0.5);
  }

  const xpY = shY + shH + 6, xpH = 7;
  bar(pad, xpY, barW, xpH, player.xp / player.xpToNext, 'rgba(4,8,16,0.5)', '#4be08a', 4);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 13px ' + font;
  ctx.fillStyle = '#9fe8ff';
  ctx.fillText('Lv.' + player.level, pad + barW + 10, xpY + xpH / 2 + 1);
  const dotY = xpY + xpH + 14, dotR = 5, dotGap = 15;
  const maxC = player.dashMaxCharges || 1;
  for (let i = 0; i < maxC; i++) {
    const cx = pad + dotR + i * dotGap;
    const ready = i < player.dashCharges;
    ctx.beginPath();
    ctx.arc(cx, dotY, dotR, 0, Math.PI * 2);
    ctx.fillStyle = ready ? '#7fe0ff' : 'rgba(120,160,200,0.22)';
    ctx.fill();
    if (ready) { ctx.strokeStyle = 'rgba(180,240,255,0.9)'; ctx.lineWidth = 1.5; ctx.stroke(); }
  }
  if (player.dashCharges < maxC && player.dashRecharge > 0) {
    const idx = player.dashCharges;
    const cx = pad + dotR + idx * dotGap;
    const prog = 1 - player.dashRecharge / CONFIG.dash.cooldown;
    ctx.beginPath();
    ctx.arc(cx, dotY, dotR + 2.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, Math.min(1, prog)));
    ctx.strokeStyle = 'rgba(130,225,255,0.85)'; ctx.lineWidth = 2; ctx.stroke();
  }
  if (game.freezeTimer > 0) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 13px ' + font;
    ctx.fillStyle = '#a8d8ff';
    ctx.fillText('❄ 冻结 ' + game.freezeTimer.toFixed(1) + 's', pad, dotY + 19);
  }
  const d = CONFIG.difficulty[game.diffKey];
  const diffColor = game.diffKey === 'easy' ? '#7df3a4'
    : game.diffKey === 'hard' ? '#ffd166' : '#ff6b81';
  const diffY = 12 + 46 + 14;
  ctx.font = 'bold 14px ' + font;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(d.label).width;
  panel(view.w - 12 - tw - 16, diffY - 12, tw + 16, 24, 8);
  ctx.fillStyle = diffColor;
  ctx.fillText(d.label, view.w - 12 - 8, diffY);
  const infoY = isLandscape() ? view.h - CONFIG.input.fixedJoy.marginY * 2 - 10 : view.h - pad - 20;
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.font = 'bold 17px ' + font;
  ctx.fillStyle = 'rgba(210,228,255,0.92)';
  ctx.fillText(formatTime(game.time), pad, infoY);
  ctx.font = 'bold 13px ' + font;
  ctx.fillStyle = 'rgba(170,195,230,0.8)';
  ctx.fillText('击杀 ' + game.killCount, pad, infoY + 20);
  const boss = game.boss;
  if (boss) {
    const bw = Math.min(420, view.w * 0.68), bh = 14;
    const bx = (view.w - bw) / 2, by = pad + 52;
    panel(bx - 6, by - 6, bw + 12, bh + 12, 8, 'rgba(4,8,16,0.6)');
    bar(bx, by, bw, bh, boss.hp / boss.maxHp, '#2a0d12', '#ff2d4a', 5);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 12px ' + font;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('BOSS  ' + Math.ceil(boss.hp) + ' / ' + Math.round(boss.maxHp), bx + bw / 2, by + bh / 2 + 1);
  }
}
function drawBossWarning() {
  if (game.bossWarningTimer <= 0) return;
  const t = performance.now() / 1000;
  const k = game.bossWarningTimer / CONFIG.fx.bossWarnTime;
  const alpha = Math.min(1, k * 3) * (0.65 + 0.35 * Math.sin(t * 12));
  const scale = 1 + Math.sin(t * 8) * 0.04;
  ctx.save();
  ctx.translate(view.w / 2, view.h * 0.28);
  ctx.scale(scale, scale);
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold ' + Math.round(Math.min(46, view.w * 0.085)) + 'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.strokeStyle = 'rgba(60,0,0,0.9)'; ctx.lineWidth = 6;
  ctx.strokeText('BOSS 来临', 0, 0);
  ctx.fillStyle = '#ff4d4d';
  ctx.fillText('BOSS 来临', 0, 0);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawJoystick() {
  if (isLandscape()) {
    const cfg = CONFIG.input.fixedJoy;
    const c = getFixedJoyCenter();
    const R = cfg.radius, K = cfg.knobRadius;
    const active = joystick.active && joystick.fixed;
    ctx.beginPath();
    ctx.arc(c.x, c.y, R, 0, Math.PI * 2);
    ctx.fillStyle = active ? 'rgba(120,200,255,0.10)' : 'rgba(255,255,255,0.045)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = active ? 'rgba(150,220,255,0.50)' : 'rgba(255,255,255,0.20)';
    ctx.stroke();
    if (active) {
      const len = Math.hypot(joystick.dx, joystick.dy);
      if (len > 0.05) {
        const ang = Math.atan2(joystick.dy, joystick.dx);
        const tx = c.x + Math.cos(ang) * (R - 10);
        const ty = c.y + Math.sin(ang) * (R - 10);
        ctx.save();
        ctx.translate(tx, ty); ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(8, 0); ctx.lineTo(-4, -6); ctx.lineTo(-4, 6);
        ctx.closePath();
        ctx.fillStyle = 'rgba(160,230,255,0.7)'; ctx.fill();
        ctx.restore();
      }
    }
    let kx = c.x, ky = c.y;
    if (active) { kx = joystick.x; ky = joystick.y; }
    ctx.beginPath();
    ctx.arc(kx, ky, K, 0, Math.PI * 2);
    ctx.fillStyle = active ? 'rgba(140,220,255,0.62)' : 'rgba(255,255,255,0.28)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = active ? 'rgba(190,240,255,0.95)' : 'rgba(255,255,255,0.42)';
    ctx.stroke();
    return;
  }
  if (!joystick.active) return;
  const R = CONFIG.input.joystickRadius, K = CONFIG.input.knobRadius;
  ctx.beginPath();
  ctx.arc(joystick.ox, joystick.oy, R, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.stroke();
  ctx.beginPath();
  ctx.arc(joystick.x, joystick.y, K, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
}
function render() {
  const w = view.w, h = view.h;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#0b0f18';
  ctx.fillRect(0, 0, w, h);
  const inWorld = game.state === GameState.PLAYING || game.state === GameState.LEVELUP
    || game.state === GameState.PAUSED || game.state === GameState.GAMEOVER;
  if (!inWorld) return;
  let sx = 0, sy = 0;
  if (game.shakeTimer > 0 && game.state !== GameState.PAUSED) {
    const s = game.shakeStrength * (game.shakeTimer / CONFIG.fx.shakeTime);
    sx = (Math.random() - 0.5) * 2 * s;
    sy = (Math.random() - 0.5) * 2 * s;
  }
  ctx.save();
  ctx.translate(w / 2 - cam.x + sx, h / 2 - cam.y + sy);
  drawGrid();
  drawXpBalls();
  drawChest();
  drawEnemies();
  drawBullets();
  drawOrbitBlades();
  drawGuard();
  drawDashTrails();
  drawBeams();
  drawPlayer();
  drawHealEffects();
  drawParticles();
  drawDamageNumbers();
  drawFloatingTexts();
  ctx.restore();
  drawVignette();
  drawBossFlash();
  drawHUD();
  drawBossWarning();
  drawChestArrow();
  drawChestNotify();
  if (game.state === GameState.PLAYING) drawJoystick();
}

const btnDash = document.getElementById('btn-dash');
const dashCountEl = document.getElementById('dash-count');
let lastDashText = '', lastDashReady = null;
function updateDashUI(show) {
  if (!btnDash || !dashCountEl) return;
  btnDash.style.display = show ? 'flex' : 'none';
  if (!show) { lastDashText = ''; lastDashReady = null; return; }
  const max = player.dashMaxCharges || 1;
  const cur = player.dashCharges || 0;
  const text = cur + '/' + max;
  if (text !== lastDashText) { lastDashText = text; dashCountEl.textContent = text; }
  const ready = cur > 0;
  if (ready !== lastDashReady) {
    lastDashReady = ready;
    btnDash.classList.toggle('ready', ready);
    btnDash.disabled = !ready;
  }
}
if (btnDash) {
  btnDash.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    AudioSys.init();
    tryDash();
  });
}

   25. 排行榜
   ========================================================= */
const lbOverlay = document.getElementById('leaderboard-overlay');
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
async function showLeaderboard() {
  AudioSys.init(); AudioSys.sfxClick();
  if (lbOverlay) lbOverlay.classList.remove('hidden');
  await refreshLeaderboard();
}
async function refreshLeaderboard() {
  const el = document.getElementById('lb-list');
  if (!el) return;
  el.innerHTML = '<div class="lb-loading">加载中…</div>';
  if (!PROTOCOL_OK) {
    el.innerHTML = '<div class="lb-empty">⚠️ 当前页面不是通过服务器打开的，无法加载排行榜</div>';
    return;
  }
  try {
    const r = await apiFetch('/api/leaderboard?difficulty=hell&limit=20');
    if (r.status === 200) renderLeaderboardFromServer(r.data);
    else renderLeaderboardError();
  } catch (e) { renderLeaderboardError(); }
}
function renderLeaderboardError() {
  const el = document.getElementById('lb-list');
  el.innerHTML = '<div class="lb-empty">无法连接服务器<br>' +
    '<button class="btn" id="lb-retry-btn" style="margin-top:14px;min-width:130px;">重试</button></div>';
  const btn = document.getElementById('lb-retry-btn');
  if (btn) btn.addEventListener('click', refreshLeaderboard);
}
function renderLeaderboardFromServer(data) {
  const el = document.getElementById('lb-list');
  const list = (data && data.list) || [];
  const me = (data && data.me) || null;
  if (list.length === 0) { el.innerHTML = '<div class="lb-empty">暂无记录</div>'; return; }
  let html = list.map(entry => {
    const rank = entry.rank;
    const cls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
    const mine = entry.mine ? ' mine' : '';
    return '<div class="lb-row ' + cls + mine + '">' +
      '<div class="lb-rank">' + rank + '</div>' +
      '<div class="lb-main">' +
        '<div class="lb-name">' + escapeHtml(entry.name) + '</div>' +
        '<div class="lb-sub">' + entry.kills + ' 击杀 · ' + formatTimeExact(entry.time) + '</div>' +
      '</div>' +
      '<div class="lb-score">' + entry.score + '</div>' +
      '</div>';
  }).join('');
  if (me && !list.some(x => x.mine)) {
    html += '<div class="lb-me-row">' +
      '<div class="lb-rank">' + me.rank + '</div>' +
      '<div class="lb-main">' +
        '<div class="lb-name">我的名次 · ' + escapeHtml(Auth.nickname || '') + '</div>' +
        '<div class="lb-sub">' + me.kills + ' 击杀 · ' + formatTimeExact(me.time) + '</div>' +
      '</div>' +
      '<div class="lb-score">' + me.score + '</div>' +
      '</div>';
  }
  el.innerHTML = html;
}
function hideLeaderboard() {
  AudioSys.sfxClick();
  if (lbOverlay) lbOverlay.classList.add('hidden');
}

   ========================================================= */
const screens = {
  [GameState.AUTH]:       document.getElementById('screen-auth'),
  [GameState.START]:      document.getElementById('screen-start'),
  [GameState.DIFFICULTY]: document.getElementById('screen-difficulty'),
  [GameState.LEVELUP]:    document.getElementById('screen-levelup'),
  [GameState.PAUSED]:     document.getElementById('screen-paused'),
  [GameState.GAMEOVER]:   document.getElementById('screen-gameover'),
  [GameState.ACCOUNT]:    document.getElementById('screen-account')
};
const btnPause = document.getElementById('btn-pause');

function setState(newState) {
  game.state = newState;
  for (const key in screens) {
    if (screens[key]) screens[key].classList.toggle('hidden', key !== newState);
  }
  if (btnPause) btnPause.style.display = (newState === GameState.PLAYING) ? 'flex' : 'none';
  if (newState === GameState.DIFFICULTY) updateDifficultyRecords();
  if (newState === GameState.START) {
    const el = document.getElementById('start-nickname');
    if (el) el.textContent = Auth.nickname || '玩家';
    const badge = document.getElementById('offline-badge');
    if (badge) badge.classList.toggle('hidden', !Auth.offline);
  }
  if (newState === GameState.ACCOUNT) {
    const info = document.getElementById('account-info');
    if (info) info.innerHTML = '昵称：<b>' + escapeHtml(Auth.nickname || '—') + '</b>';
  }
  updateDashUI(newState === GameState.PLAYING);
  joystick.active = false; joystick.id = null;
  joystick.fixed = false; joystick.dx = joystick.dy = 0;
  for (const k in keys) keys[k] = false;
}

function updateDifficultyRecords() {
  ['easy','hard','hell'].forEach((k) => {
    const el = document.getElementById('record-' + k);
    if (!el) return;
    const r = Save.data[k];
    if (r.bestTime <= 0 && r.bestKills <= 0 && !r.cleared) { el.textContent = '暂无记录'; return; }
    const parts = [];
    if (r.bestTime > 0) parts.push('最长 ' + formatTime(r.bestTime));
    if (r.bestKills > 0) parts.push('击杀 ' + r.bestKills);
    if (r.cleared) parts.push('已通关');
    el.textContent = parts.join(' · ');
  });
}

/* =========================================================
   27. 认证流程
   ========================================================= */
function showAuthScreen(errorMsg) {
  setState(GameState.AUTH);
  switchAuthTab('login');
  const el = document.getElementById('auth-global-error');
  if (el) {
    el.textContent = errorMsg || '';
    el.style.cssText = '';
  }
  if (!PROTOCOL_OK) showProtocolWarning();
  let oldNick = '';
  try { oldNick = localStorage.getItem(Auth.NICK_KEY) || ''; } catch (e) {}
  if (oldNick) {
    const ln = document.getElementById('login-nickname');
    const rn = document.getElementById('reg-nickname');
    if (ln && !ln.value) ln.value = oldNick;
    if (rn && !rn.value) rn.value = oldNick;
  }
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.getElementById('auth-panel-login').classList.toggle('hidden', tab !== 'login');
  document.getElementById('auth-panel-register').classList.toggle('hidden', tab !== 'register');
  document.getElementById('login-error').textContent = '';
  document.getElementById('reg-error').textContent = '';
}

/* ★ 网络错误统一格式化 */
function showNetworkError(errEl, prefix) {
  prefix = prefix || '';
  errEl.innerHTML =
    (prefix ? prefix + '<br>' : '') +
    '无法连接服务器。<br>' +
    '请确认：<br>' +
    '1. 服务器已启动（终端里能看到"服务器已启动"）<br>' +
    '2. 通过 <b>http://localhost:8000</b> 或 <b>http://你的MacIP:8000</b> 访问<br>' +
    '3. 不是双击打开 index.html 文件';
}

async function doLogin() {
  const nickEl = document.getElementById('login-nickname');
  const pwEl = document.getElementById('login-password');
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  const nickname = (nickEl.value || '').trim();
  const password = pwEl.value || '';

  errEl.innerHTML = '';
  if (!nickname) { errEl.textContent = '请输入昵称'; return; }
  if (!password) { errEl.textContent = '请输入密码'; return; }

  if (!PROTOCOL_OK) {
    showNetworkError(errEl, '当前页面地址不是 http，无法连接服务器');
    showProtocolWarning();
    return;
  }

  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const r = await apiFetch('/api/login', {
      method: 'POST',
      body: JSON.stringify({ nickname, password })
    });
    if (r.status === 200 && r.data.token) {
      await handleAuthSuccess(r.data);
    } else if (r.status === 401) {
      errEl.textContent = r.data.error || '昵称或密码错误';
    } else if (r.status === 429) {
      errEl.textContent = r.data.error || '尝试过于频繁，请稍后再试';
    } else {
      errEl.innerHTML = '登录失败：' + escapeHtml(r.data.error || '未知错误') +
        '<br><span style="font-size:11px;opacity:0.7;">HTTP ' + r.status + '</span>';
    }
  } catch (e) {
    showNetworkError(errEl, e.message === 'timeout' ? '服务器超时（5 秒）' : '');
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
}

async function doRegister() {
  const nickEl = document.getElementById('reg-nickname');
  const pwEl = document.getElementById('reg-password');
  const pw2El = document.getElementById('reg-password2');
  const errEl = document.getElementById('reg-error');
  const btn = document.getElementById('btn-register');
  const nickname = (nickEl.value || '').trim();
  const password = pwEl.value || '';
  const password2 = pw2El.value || '';

  errEl.innerHTML = '';
  if (!nickname) { errEl.textContent = '请输入昵称'; return; }
  if (nickname.length > 12) { errEl.textContent = '昵称最多 12 个字符'; return; }
  if (password.length < 6 || password.length > 32) { errEl.textContent = '密码需 6–32 个字符'; return; }
  if (password === nickname) { errEl.textContent = '密码不能与昵称相同'; return; }
  if (password !== password2) { errEl.textContent = '两次输入的密码不一致'; return; }

  /* ★ 如果页面不是通过 http 打开，直接拒绝并显示明确原因 */
  if (!PROTOCOL_OK) {
    showNetworkError(errEl,
      '当前页面地址是 <code>' + escapeHtml(location.protocol) + '</code>，不是 http，无法连接服务器');
    showProtocolWarning();
    return;
  }

  btn.disabled = true;
  btn.textContent = '注册中…';
  try {
    const r = await apiFetch('/api/register', {
      method: 'POST',
      body: JSON.stringify({ nickname, password })
    });
    if (r.status === 200 && r.data.token) {
      await handleAuthSuccess(r.data);
    } else if (r.status === 409) {
      errEl.textContent = '昵称已被占用';
    } else if (r.status === 400) {
      errEl.innerHTML = '注册失败：' + escapeHtml(r.data.error || '参数不合法') +
        '<br><span style="font-size:11px;opacity:0.7;">HTTP 400</span>';
    } else if (r.status === 429) {
      errEl.textContent = r.data.error || '注册过于频繁，请稍后再试';
    } else {
      errEl.innerHTML = '注册失败：' + escapeHtml(r.data.error || '未知错误') +
        '<br><span style="font-size:11px;opacity:0.7;">HTTP ' + r.status + '</span>' +
        '<br><span style="font-size:11px;opacity:0.7;">请查看服务器终端里的 [register] 报错</span>';
    }
  } catch (e) {
    showNetworkError(errEl, e.message === 'timeout' ? '服务器超时（5 秒）' : '');
  } finally {
    btn.disabled = false;
    btn.textContent = '注册';
  }
}

async function handleAuthSuccess(data) {
  Auth.set(data.token, data.nickname);
  if (data.progress) {
    const merged = mergeProgress(Save.toProgress(), data.progress);
    applyProgress(merged);
    try {
      await apiFetch('/api/progress', {
        method: 'PUT',
        body: JSON.stringify({ progress: Save.toProgress() })
      });
    } catch (e) {}
  }
  setState(GameState.START);
  PendingScores.retry();
}

function mergeProgress(local, remote) {
  const out = {};
  ['easy','hard','hell'].forEach(k => {
    const l = (local && local[k]) || {};
    const r = (remote && remote[k]) || {};
    out[k] = {
      bestTime: Math.max(l.bestTime || 0, r.bestTime || 0),
      bestKills: Math.max(l.bestKills || 0, r.bestKills || 0),
      cleared: !!(l.cleared || r.cleared)
    };
  });
  return out;
}

function applyProgress(p) {
  ['easy','hard','hell'].forEach(k => {
    if (!p[k]) return;
    Save.data[k].bestTime = Math.max(Save.data[k].bestTime, p[k].bestTime || 0);
    Save.data[k].bestKills = Math.max(Save.data[k].bestKills, p[k].bestKills || 0);
    Save.data[k].cleared = Save.data[k].cleared || !!p[k].cleared;
  });
  Save.persist();
}

async function doLogout() {
  try { await apiFetch('/api/logout', { method: 'POST' }); } catch (e) {}
  Auth.clear();
  hideAccountOverlay();
  showAuthScreen();
}

function enterOffline() {
  Auth.clear();
  Auth.offline = true;
  const el = document.getElementById('start-nickname');
  if (el) el.textContent = '离线玩家';
  const badge = document.getElementById('offline-badge');
  if (badge) badge.classList.remove('hidden');

}

/* =========================================================
   28. 昵称可用性
   ========================================================= */
let nickCheckTimer = 0, nickCheckSeq = 0;
async function checkNicknameAvailability() {
  const nickEl = document.getElementById('reg-nickname');
  const statusEl = document.getElementById('reg-nick-status');
  if (!nickEl || !statusEl) return;
  const name = (nickEl.value || '').trim();
  statusEl.className = 'nick-status';
  statusEl.textContent = '';
  if (!name) return;
  if (name.length > 12) {
    statusEl.classList.add('err');
    statusEl.textContent = '昵称最多 12 个字符';
    return;
  }
  if (!PROTOCOL_OK) {
    statusEl.classList.add('err');
    statusEl.textContent = '无法连接服务器';
    return;
  }
  statusEl.textContent = '检查中…';
  const seq = ++nickCheckSeq;
  try {
    const r = await apiFetch('/api/nickname-available?name=' + encodeURIComponent(name));
    if (seq !== nickCheckSeq) return;
    if (r.status === 200 && r.data.available === true) {
      statusEl.classList.add('ok');
      statusEl.textContent = '✓ 昵称可用';
    } else if (r.status === 200) {
      statusEl.classList.add('err');
      statusEl.textContent = '该昵称已被使用';
    } else {
      statusEl.textContent = '';
    }
  } catch (e) {
    if (seq !== nickCheckSeq) return;
    statusEl.classList.add('err');
    statusEl.textContent = '无法连接服务器';
  }
}

/* =========================================================

const accountOverlay = document.getElementById('account-overlay');
let accountMode = 'rename';

function openAccountOverlay(mode) {
  accountMode = mode;

    renameEl.classList.add('hidden');
    pwEl.style.display = 'flex';
    pwEl.classList.remove('hidden');

    document.getElementById('new-pw-input2').value = '';

}
function hideAccountOverlay() { accountOverlay.classList.add('hidden'); }

async function submitAccountChange() {
  if (accountMode === 'rename') {
    const nickEl = document.getElementById('rename-input');
    const errEl = document.getElementById('rename-error');
    const btn = document.getElementById('acc-panel-ok');
    const name = (nickEl.value || '').trim();
    errEl.innerHTML = '';
    if (!name) { errEl.textContent = '请输入昵称'; return; }
    if (name.length > 12) { errEl.textContent = '昵称最多 12 个字符'; return; }
    if (name === Auth.nickname) { errEl.textContent = '昵称未变化'; return; }
    btn.disabled = true;
    btn.textContent = '提交中…';
    try {
      const r = await apiFetch('/api/rename', {
        method: 'POST',
        body: JSON.stringify({ nickname: name })
      });
      if (r.status === 200) {
        Auth.setNickname(r.data.nickname);
        hideAccountOverlay();
        setState(GameState.ACCOUNT);
      } else if (r.status === 409) errEl.textContent = '昵称已被占用';
      else if (r.status === 401) {
        errEl.textContent = '登录已过期，请重新登录';
        Auth.clear();
        hideAccountOverlay();
        showAuthScreen('登录已过期，请重新登录');
      } else errEl.textContent = r.data.error || '修改失败';
    } catch (e) {
      errEl.textContent = '无法连接服务器';
    } finally {
      btn.disabled = false;
      btn.textContent = '确定';
    }
  } else {
    const oldEl = document.getElementById('old-pw-input');
    const newEl = document.getElementById('new-pw-input');
    const new2El = document.getElementById('new-pw-input2');
    const errEl = document.getElementById('password-error');
    const btn = document.getElementById('acc-panel-ok');
    const oldPassword = oldEl.value || '';
    const newPassword = newEl.value || '';
    const newPassword2 = new2El.value || '';
    errEl.innerHTML = '';
    if (!oldPassword) { errEl.textContent = '请输入旧密码'; return; }
    if (newPassword.length < 6 || newPassword.length > 32) { errEl.textContent = '新密码需 6–32 个字符'; return; }
    if (newPassword === Auth.nickname) { errEl.textContent = '新密码不能与昵称相同'; return; }
    if (newPassword !== newPassword2) { errEl.textContent = '两次输入的新密码不一致'; return; }
    btn.disabled = true;
    btn.textContent = '提交中…';
    try {
      const r = await apiFetch('/api/change-password', {
        method: 'POST',
        body: JSON.stringify({ oldPassword, newPassword })
      });
      if (r.status === 200) {
        hideAccountOverlay();
        setState(GameState.ACCOUNT);
      } else if (r.status === 401) errEl.textContent = '旧密码错误';
      else errEl.textContent = r.data.error || '修改失败';
    } catch (e) {
      errEl.textContent = '无法连接服务器';
    } finally {
      btn.disabled = false;
      btn.textContent = '确定';
    }
  }
}

/* =========================================================
   32. 主循环
   ========================================================= */
let lastTime = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  try {
    if (!lastTime) lastTime = ts;
    let rawDt = (ts - lastTime) / 1000;
    lastTime = ts;
    if (rawDt > 0.1) rawDt = 0.1;
    if (rawDt < 0) rawDt = 0;
    update(rawDt);
    render();
  } catch (err) {
    console.error('[幸存者 帧错误]', err);
  }
}

/* =========================================================
   33. 启动
   ========================================================= */
async function boot() {
  Save.load();
  Auth.load();
  PendingScores.load();
  updateDifficultyRecords();

  /* ★ 一开始就提示协议问题 */
  if (!PROTOCOL_OK) {
    showProtocolWarning();
    showAuthScreen('⚠️ 当前页面不是通过服务器打开的，无法注册/登录/上榜');
    // 给 auth-global-error 上更醒目的样式
    const el = document.getElementById('auth-global-error');
    if (el) {
      el.style.cssText = 'color:#ffd166;font-size:13px;line-height:1.5;' +
        'background:rgba(120,20,30,0.5);padding:10px 14px;border-radius:10px;' +
        'border:1px solid rgba(255,107,129,0.6);max-width:340px;';
    }
    requestAnimationFrame(loop);
    return;
  }

  if (Auth.token) {
    try {
      const r = await apiFetch('/api/me');
      if (r.status === 200 && r.data.nickname) {
        Auth.nickname = r.data.nickname;
        try {
          const pr = await apiFetch('/api/progress');
          if (pr.status === 200) {
            const merged = mergeProgress(Save.toProgress(), pr.data);
            applyProgress(merged);
            try {
              await apiFetch('/api/progress', {
                method: 'PUT',
                body: JSON.stringify({ progress: Save.toProgress() })
              });
            } catch (e) {}
          }
        } catch (e) {}
        setState(GameState.START);
        PendingScores.retry();
        requestAnimationFrame(loop);
        return;
      } else if (r.status === 401) {
        Auth.clear();
        showAuthScreen('登录已过期，请重新登录');
      } else {
        showAuthScreen('无法连接服务器');
      }
    } catch (e) {
      showAuthScreen('无法连接服务器');
    }
  } else {
    showAuthScreen();
  }

  requestAnimationFrame(loop);
}

boot();
